<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- 不设 maximum-scale/user-scalable：禁止缩放违反 WCAG 1.4.4，弱视用户必须能放大 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小计划</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="小计划" />
  <link rel="apple-touch-icon" href="icon-180.png" />

  <!-- Supabase JS（公开 CDN，仅用 anon key，无法越权） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1ea;
      --card: #fffdfa;
      --field: #fff;             /* 输入框底色 */
      --field-soft: #faf6f0;     /* 代码框等次级底色 */
      --ink: #2c2722;
      /* 原 #8a8076 在卡片上只有 3.8:1，13px 小字不达 WCAG AA，压暗到 5.4:1 */
      --ink-soft: #726859;
      --line: #ece4d8;
      --accent: #c2774f;         /* 品牌装饰色：边框、圆点、进度环 */
      --accent-text: #8a5733;    /* 强调色当「文字」用时：卡片上 5.9:1 / 米底 5.4:1 */
      --accent-strong: #a8603b;  /* 按钮底色，配白字 4.8:1 */
      --accent-soft: #f3e3d8;
      --on-accent: #fff;
      --done: #6f9c7a;
      --delay: #d39a4e;
      --skip: #b6a89a;
      --danger: #b4483c;
      --mask: rgba(40,30,20,.4);
      --dot: rgba(194,119,79,.20); /* 波点纹理：强调色 20% */
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 6px;      /* 气泡尾巴收角 / 方勾框共用：--radius-sm 太圆，收不出尾巴 */
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-pill: 999px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    /* 由 JS 实测后写入：tabbar 的 offsetHeight，已含它自己的安全区内边距。
       全站底部留白一律只用这个变量，不要再叠加 --safe-bottom —— 否则会多留 34px。
       兜底 66px：没测到就按「最坏情况多 0.5px 露背景，也别压到 tabbar」走。 */
    --tabbar-h: 66px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { min-height: 100dvh; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--ink);
      font-size: 16px; line-height: 1.5;
      min-height: 100vh;            /* iOS 15.0–15.3 不支持 dvh，先给 vh 兜底 */
      min-height: 100dvh;
      /* 全站底部留白 = tabbar 实测高度（已含它自己的安全区），不再叠 --safe-bottom */
      padding-bottom: var(--tabbar-h, 66px);
      /* 低饱和波点纹理。用 radial-gradient 平铺而不是内联 SVG pattern：
         后者要 URL 编码，且 background-size 缩放时点会变形。静态绘制走合成层，不掉帧 */
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
      background-size: 18px 18px;
    }
    .topbar {
      padding: calc(var(--safe-top) + 16px) 20px 12px;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .topbar h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .5px; }
    .topbar .right { display: flex; align-items: center; gap: 8px; }
    .topbar .date { font-size: 13px; color: var(--ink-soft); }
    .wrap { padding: 0 16px; }
    .section-title {
      font-size: 13px; color: var(--ink-soft); font-weight: 600;
      margin: 22px 4px 10px; letter-spacing: 1px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px 16px; margin: 10px 0;
      box-shadow: 0 1px 2px rgba(60,40,20,.03);
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--ink-soft); font-size: 13px; }
    .tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; padding: 2px 9px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-text); font-weight: 600;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.todo { background: var(--ink-soft); }
    .dot.done { background: var(--done); }
    .dot.delayed { background: var(--delay); }
    .dot.skipped { background: var(--skip); }

    input[type=text], input[type=email], input[type=password], input[type=date], textarea, select {
      width: 100%; border: 1px solid var(--line); border-radius: var(--radius-md);
      padding: 11px 13px; font: inherit; color: var(--ink);
      background: var(--field); outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    /* 键盘可达性：整个应用之前 0 处焦点环 */
    :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
    textarea { resize: vertical; min-height: 64px; }
    button {
      font: inherit; cursor: pointer; border: 0; border-radius: var(--radius-md);
      padding: 11px 16px; background: var(--accent-strong); color: var(--on-accent); font-weight: 600;
      transition: opacity .15s, filter .15s;
    }
    button:active { opacity: .75; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    @media (hover: hover) { button:not(:disabled):hover { filter: brightness(1.07); } }
    button.ghost { background: transparent; color: var(--accent-text); border: 1px solid var(--accent); }
    button.soft { background: var(--accent-soft); color: var(--accent-text); }
    button.block { width: 100%; }
    /* 原来 padding 7px 12px → 实测高约 34px，低于 44px 触控标准 */
    button.sm { padding: 10px 14px; font-size: 14px; border-radius: var(--radius-sm); }
    .iconbtn {
      background: transparent; color: var(--ink-soft); padding: 6px;
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: var(--radius-sm); position: relative;
    }
    .iconbtn:active { background: var(--line); }
    /* 视觉仍是 34px，但把可点区域撑到 44×44（WCAG 2.5.8 / Apple HIG），不撑布局 */
    .iconbtn::after {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 44px; height: 44px; transform: translate(-50%, -50%);
    }

    .task { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
    .task:last-child { border-bottom: 0; }
    .check {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line);
      flex: 0 0 auto; display: grid; place-items: center;
      background: var(--field); color: var(--field);
      position: relative; cursor: pointer;
    }
    /* 打卡圆圈是全应用最高频的点击目标。视觉仍是 24px，命中区撑到 44×44。
       向外各扩 10px，刚好落在 .task 的 12px gap 内，不会压到标题文字 */
    .check::after {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: 44px; height: 44px; transform: translate(-50%, -50%);
    }
    .check.on { background: var(--done); border-color: var(--done); }
    .task.delayed .check { border-color: var(--delay); }
    .check .st { font-size: 12px; font-weight: 600; line-height: 1; }
    /* 非完成状态的记号要用状态色，否则白底白字看不见 */
    .task.delayed .check .st { color: var(--delay); }
    .task.skipped .check .st { color: var(--skip); }
    .task.done .label { text-decoration: line-through; color: var(--ink-soft); }
    .task.skipped .label { text-decoration: line-through; color: var(--skip); }
    .task.skipped .check { border-color: var(--skip); }
    .task .label { flex: 1; min-width: 0; word-break: break-word; }
    .small-actions { display: flex; gap: 6px; }

    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      /* blur 从 12px 降到 6px：12px 的毛玻璃在 iOS 上每帧重算背景，是头号掉帧源 */
      /* 背景从 --card 派生，四套主题 × 明暗全自动跟随，不用在 applyTheme 里逐项覆盖。
         原先写死 rgba(255,253,250,.94)，换主题/切深色时底部会留一条固定色的亮条。 */
      background: var(--card);
      background: color-mix(in srgb, var(--card) 94%, transparent);
      backdrop-filter: saturate(1.4) blur(6px);
      border-top: 1px solid var(--line);
      display: flex; padding: 6px 4px calc(6px + var(--safe-bottom));
    }
    .tab {
      flex: 1; background: transparent; border: 0; border-radius: var(--radius-md);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 0; color: var(--ink-soft); font-size: 11px; font-weight: 600;
      white-space: nowrap;
    }
    .tab.active { color: var(--accent-text); }
    .tab svg { width: 22px; height: 22px; }

    .mask {
      position: fixed; inset: 0; background: var(--mask);
      display: none; align-items: flex-end; z-index: 50;
    }
    .mask.show { display: flex; }
    .sheet {
      background: var(--card); width: 100%; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 18px 18px calc(18px + var(--safe-bottom));
      max-height: 84vh; overflow: auto;
    }
    .sheet h3 { margin: 0 0 14px; font-size: 17px; }
    .sheet .opt { display: flex; gap: 10px; margin: 8px 0; }
    .empty { text-align: center; color: var(--ink-soft); padding: 30px 10px; font-size: 14px; }

    #toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
      background: rgba(44,39,34,.92); color: var(--field); padding: 10px 18px; border-radius: var(--radius-pill);
      font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 120;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .cleared-banner {
      background: var(--accent-soft); color: var(--accent-text); border-radius: var(--radius-md);
      padding: 10px 14px; font-size: 14px; font-weight: 600; text-align: center; margin: 4px 0 12px;
    }
    /* ---- 明日计划：今日视图底部的一张内联卡片 ---- */
    .tmr-card { padding: 0; }
    .tmr-head {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: 0; margin: 0; padding: 14px;
      font: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
      text-align: left; cursor: pointer;
    }
    .tmr-icon { display: inline-flex; color: var(--ink-soft); }
    .tmr-ar { display: inline-flex; color: var(--ink-soft); transition: transform .2s; }
    .tmr-card.open .tmr-ar { transform: rotate(180deg); }
    .tmr-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
    .tmr-body .empty { padding: 16px 8px 18px; font-size: 13px; }
    .tmr-body .row input { margin: 12px 0 0; }
    .tmr-more {
      display: block; width: 100%; background: none; border: 0; border-top: 1px solid var(--line);
      padding: 10px 0; font: inherit; font-size: 13px; color: var(--ink-soft); cursor: pointer;
    }
    .date-badge {
      display: inline-block; margin-left: 6px; padding: 1px 7px; vertical-align: 1px;
      border: 1px solid var(--line); border-radius: 999px;
      font-size: 11px; font-weight: 400; color: var(--ink-soft);
    }
    .progress-bar {
      position: relative;
      height: 8px;
      background: var(--line);
      border-radius: 4px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .cat-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; flex:0 0 auto; }
    .cat-chips { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
    .cat-chip { border:1px solid var(--line); background:transparent; color:var(--ink-soft); border-radius:14px; padding:3px 10px; font-size:12px; cursor:pointer; }
    .cat-chip.on { background:var(--c); border-color:var(--c); color:#fff; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:12px; }
    .grid-h { text-align:center; font-size:11px; color:var(--ink-soft); padding:4px 0; }
    .grid-c { position:relative; text-align:center; font-size:13px; padding:8px 0; border-radius:8px; background:var(--field); min-height:34px; }
    .grid-c.empty { background:transparent; }
    .grid-c.today { background:var(--accent-soft); color:var(--accent-text); font-weight:500; }
    .sd-dot { display:block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin:3px auto 0; }
    .task-dot { position:absolute; top:2px; right:4px; font-size:10px; color:var(--ink-soft); }
    .warm-card { background:var(--accent-soft); }
    .badge-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .badge { background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 10px; text-align:center; }
    .badge .bi { font-size:22px; line-height:1.2; filter:grayscale(1); opacity:.35; }
    .badge.on { border-color:var(--accent); background:var(--accent-soft); }
    .badge.on .bi { filter:none; opacity:1; }
    .badge .bn { font-size:13px; font-weight:600; margin-top:4px; }
    .badge .bd { font-size:11px; color:var(--ink-soft); margin-top:2px; }
    .badge .bp { font-size:11px; color:var(--ink-soft); margin-top:4px; }
    .cloud-badge { font-size: 12px; color: var(--done); font-weight: 600; }
    .cloud-note { font-size: 12px; color: var(--ink-soft); margin: -4px 4px 8px; }
    .theme-swatch {
      width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line);
      padding: 0; display: grid; place-items: center; cursor: pointer; flex: 0 0 auto;
    }
    .theme-swatch span { width: 20px; height: 20px; border-radius: 50%; display: block; }
    .theme-swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .sync-state {
      font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px;
      color: var(--ink-soft); white-space: nowrap;
    }
    .sync-state::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); flex: 0 0 auto; }
    .sync-state.ok { color: var(--done); } .sync-state.ok::before { background: var(--done); }
    .sync-state.syncing { color: var(--accent-text); } .sync-state.syncing::before { background: var(--accent); animation: syncPulse 1s ease-in-out infinite; }
    .sync-state.err { color: var(--danger); } .sync-state.err::before { background: var(--danger); }
    @keyframes syncPulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .codebox {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
      background: var(--field-soft); border: 1px dashed var(--line); border-radius: var(--radius-sm);
      padding: 10px; word-break: break-all; color: var(--ink);
    }

    /* ---------- 登录 / 注册首屏 ---------- */
    #auth {
      position: fixed; inset: 0; z-index: 100; background: var(--bg);
      display: flex; flex-direction: column; overflow: auto;
      padding: calc(var(--safe-top) + 44px) 22px calc(28px + var(--safe-bottom));
    }
    #auth.hide { display: none; }
    .auth-brand { text-align: center; margin-bottom: 24px; }
    .auth-logo {
      width: 62px; height: 62px; border-radius: 20px; margin: 0 auto 14px;
      background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
    }
    .auth-logo svg { width: 30px; height: 30px; }
    .auth-brand h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: 2px; }
    .auth-brand p { margin: 0; color: var(--ink-soft); font-size: 13px; }
    .auth-tabs {
      display: flex; gap: 4px; background: var(--accent-soft);
      border-radius: 12px; padding: 4px; margin-bottom: 16px;
    }
    /* 文字用 accent-text：accent 原色在这块浅底上只有 2.8:1 */
    .auth-tabs button { flex: 1; background: transparent; color: var(--accent-text); font-size: 14px; padding: 9px 0; border-radius: 9px; }
    .auth-tabs button.on { background: var(--field); box-shadow: 0 1px 2px rgba(60,40,20,.07); }
    .auth-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--ink-soft); margin: 0 0 6px 2px; }
    .auth-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
    .cb { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; margin: 0; }
    .cb input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
    .auth-err { color: var(--danger); font-size: 13px; min-height: 18px; text-align: center; margin: 0 0 8px; }
    .auth-foot { margin-top: 16px; text-align: center; }
    /* padding 6px → 12px，把命中区从 27px 撑到 44px 以上 */
    .linkbtn { background: transparent; color: var(--ink-soft); font-size: 13px; padding: 12px; text-decoration: underline; font-weight: 500; }
    .auth-tip { margin-top: 14px; font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.7; }
    #auSubmit[disabled] { opacity: .6; }

    /* ---------- 桌面端（≥768px）---------- */
    @media (min-width: 768px) {
      .topbar, .wrap { max-width: 720px; margin-left: auto; margin-right: auto; }
      /* 底部 Tab 不通栏：改成居中胶囊。否则标题贴左、内容居中，视觉上会错位 */
      .tabbar {
        left: 50%; right: auto; transform: translateX(-50%);
        width: 720px; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        border-left: 1px solid var(--line); border-right: 1px solid var(--line);
      }
      /* 弹层在桌面改居中对话框，而不是贴底的抽屉 */
      .mask { align-items: center; justify-content: center; padding: 24px; }
      .sheet { width: 100%; max-width: 480px; border-radius: var(--radius-lg); }
      /* 双栏用 columns 而不是 grid：grid 会把「小标题」和它下面的「卡片」拆到左右
         两栏；columns 是自然流式排版，配合 break-inside 能保证卡片不被切断 */
      #app.two-col { columns: 2; column-gap: 20px; }
      #app.two-col .card,
      #app.two-col .cleared-banner,
      #app.two-col .empty { break-inside: avoid; }
      #app.two-col .section-title { break-after: avoid; }
    }

    /* ===== 统计页 ===== */
    .stat-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat-summary .c {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 14px 10px; text-align: center;
    }
    .stat-summary .n { font-size: 26px; font-weight: 700; color: var(--accent-strong); line-height: 1.1; }
    .stat-summary .t { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
    .heatmap { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
    .heatmap .cell {
      aspect-ratio: 1; border-radius: 5px; background: var(--line);
      position: relative; transition: transform .1s;
    }
    .heatmap .cell:active { transform: scale(.88); }
    .heatmap .cell.l1 { background: rgba(194,119,79,.30); }
    .heatmap .cell.l2 { background: rgba(194,119,79,.52); }
    .heatmap .cell.l3 { background: rgba(194,119,79,.74); }
    .heatmap .cell.l4 { background: var(--accent); }
    @supports (background: color-mix(in srgb, red, blue)) {
      .heatmap .cell.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--line)); }
      .heatmap .cell.l2 { background: color-mix(in srgb, var(--accent) 52%, var(--line)); }
      .heatmap .cell.l3 { background: color-mix(in srgb, var(--accent) 74%, var(--line)); }
      .heatmap .cell.l4 { background: var(--accent); }
    }
    .trend { display: flex; align-items: flex-end; gap: 8px; height: 132px; }
    .trend .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .trend .track { width: 100%; flex: 1; display: flex; align-items: flex-end; }
    .trend .bar { width: 100%; border-radius: 6px 6px 0 0; background: var(--accent); min-height: 3px; transition: height .25s; }
    .trend .bar.zero { background: var(--line); }
    .trend .lab { font-size: 11px; color: var(--ink-soft); }
    .trend .val { font-size: 11px; font-weight: 700; color: var(--accent-strong); }

    /* ===== 问问（专属规划专家）=====
       配色全部复用既有变量，深色下自动跟随；唯一例外见 applyTheme 里的 --danger */
    body.chat-mode {
      height: 100vh;              /* dvh 降级链：老 Safari 不支持时退 vh */
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
      /* 关闭键盘时，底留白 = tabbar 实测高度（已含它的安全区）。
         开键盘由 JS 把 body 高度压到 visualViewport.height、并把本类换成
         .kb-open（padding-bottom:0），让输入条正好落在键盘顶边，见 syncKb()。
         弃用 --kb 变量：--kb 和 visualViewport 设高度是两套互斥机制，并存会算两次。 */
      padding-bottom: var(--tabbar-h);
    }
    body.kb-open .composer-note { display: none; }
    /* 键盘弹起时 tabbar 本来就被键盘盖住，不用再给它留位；不留这段，
       输入条会被 body 高度和 padding 一起顶到键盘上面去 */
    body.chat-mode.kb-open { padding-bottom: 0; }
    /* #app 是 body 的 flex 子项，不给 flex:1 的话内容区撑不满剩余高度。
       min-height:0 是 flex 子项能收缩的前提 */
    body.chat-mode > #app { flex: 1; min-height: 0; padding: 0; display: flex; }
    /* 输入条和消息列表住在 #app 外面。render() 重建 app.innerHTML
       物理上碰不到它们 —— 对方的实时同步推来一条任务，用户正在敲的字、
       键盘、光标全都在。iOS 上程序化 focus() 只在用户手势调用栈里有效，
       实时回调不在里面，所以「还原 value + focus」这种事后补救是没用的，
       只能靠结构保证。 */
    .chat-layer { flex: 1; min-height: 0; display: flex; flex-direction: column;
      width: 100%; max-width: 720px; margin: 0 auto; }
    .chat-layer[hidden] { display: none; }
    .chat-shell { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; }
    .chat-body { flex: 1; min-height: 0; position: relative; }
    .chat-scroll { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain; }
    .chat-pad { display: flex; flex-direction: column; padding: 12px 16px 16px; }

    .msg { display: flex; flex-direction: column; margin-bottom: 6px; }
    .msg.me { align-items: flex-end; }
    .msg.them { align-items: flex-start; }
    .msg.gap { margin-top: 16px; }
    .bubble { max-width: min(76%, 34em); padding: 10px 14px; border-radius: var(--radius);
      font-size: 16px; line-height: 1.6; word-break: break-word; }
    .bubble.me { background: var(--accent-strong); color: var(--on-accent);
      border-bottom-right-radius: var(--radius-xs); }
    .bubble.them { background: var(--card); color: var(--ink);
      border-bottom-left-radius: var(--radius-xs); }
    .bubble.error { background: var(--field); border: 1px dashed var(--danger); color: var(--ink); }
    .bubble-body p { margin: 0 0 8px; }
    .bubble-body p:last-child { margin-bottom: 0; }
    .bubble-body ul, .bubble-body ol { margin: 0 0 8px; padding-left: 20px; }
    .bubble-body strong { font-weight: 600; }
    .inline-code { background: var(--field-soft); border-radius: 4px; padding: 1px 4px;
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .msg-meta { display: flex; align-items: center; gap: 5px; min-height: 26px; padding: 4px 2px;
      font-size: 11px; color: var(--ink-soft); position: relative; background: none; border: 0; }
    /* 整行可点，但视觉高度只有 26px，靠 ::after 把命中区撑到 44 */
    .msg-meta::after { content: ''; position: absolute; left: -8px; right: -8px; top: -9px; bottom: -9px; }
    .msg-meta .retry { margin-left: 8px; }

    .typing { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
    .typing .dots { display: flex; align-items: center; gap: 4px; }
    .typing .dots i { display: block; border-radius: 50%; background: var(--ink-soft);
      animation: inkBreathe 1.4s ease-in-out infinite; }
    .typing .dots i:nth-child(1), .typing .dots i:nth-child(3) { width: 5px; height: 5px; }
    .typing .dots i:nth-child(2) { width: 6px; height: 6px; animation-delay: .18s; }
    .typing .dots i:nth-child(3) { animation-delay: .36s; }
    @keyframes inkBreathe { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }

    .proposal { background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); overflow: hidden; margin: 8px 0; }
    .proposal.done { background: var(--field-soft); }
    .proposal.done .prop-head { color: var(--ink-soft); }
    .prop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 14px; font-size: 12px; color: var(--ink-soft); border-bottom: 1px solid var(--line); }
    .prop-row { border-bottom: 1px solid var(--line); }
    .prop-row:last-of-type { border-bottom: 0; }
    .prop-line { display: flex; align-items: center; gap: 10px; min-height: 50px;
      padding: 11px 14px; width: 100%; background: none; border: 0; text-align: left; color: var(--ink); }
    .prop-line .plabel { flex: 1; min-width: 0; font-size: 15px; }
    /* 方勾框而不是圆勾：圆勾在这个 app 里等于「任务状态」，这里语义是「选不选」 */
    .tick { flex: none; width: 20px; height: 20px; border-radius: var(--radius-xs);
      border: 1.5px solid var(--line); background: var(--field);
      display: flex; align-items: center; justify-content: center; color: #fff; }
    .tick.on { background: var(--accent-strong); border-color: var(--accent-strong); }
    .tick svg { opacity: 0; }
    .tick.on svg { opacity: 1; }
    .proposal.done .tick { display: none; }
    .prop-date { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 34px;
      padding: 0 10px; border-radius: var(--radius-pill); border: 1px solid var(--line);
      background: var(--field); color: var(--ink); font-size: 13px; position: relative; }
    .prop-date::after { content: ''; position: absolute; left: -5px; right: -5px; top: -5px; bottom: -5px; }
    .proposal.done .prop-date { display: none; }
    .diff-old { font-size: 13px; color: var(--ink-soft); text-decoration: line-through;
      border: 1px dashed var(--line); border-radius: var(--radius-pill); padding: 1px 8px; }
    .diff-arrow { font-size: 13px; color: var(--ink-soft); }
    .diff-new { font-size: 13px; color: var(--accent-text); background: var(--accent-soft);
      border: 1px solid transparent; border-radius: var(--radius-pill); padding: 1px 8px; }
    .prop-foot { display: flex; gap: 8px; padding: 11px 14px; }

    .auto-note { position: relative; margin: 8px 0; padding: 10px 12px 14px; font-size: 13px;
      line-height: 1.55; border-radius: var(--radius-md);
      background: var(--accent-soft); color: var(--accent-text); border: 1px solid transparent;
      transition: background-color .3s, border-color .3s, color .3s; }
    /* 5 秒后只是「降级」，不是「失效」——撤销按钮一直在 */
    .auto-note.calm { background: transparent; border-color: var(--line); color: var(--ink-soft); }
    .auto-line { display: flex; align-items: center; gap: 8px; }
    .auto-line + .auto-line { margin-top: 6px; }
    .auto-line .txt { flex: 1; min-width: 0; }
    .timer { position: absolute; left: 12px; right: 12px; bottom: 6px; height: 2px;
      background: var(--line); overflow: hidden; }
    .timer i { display: block; height: 100%; background: var(--accent); opacity: .55;
      transform-origin: left; animation: shrinkBar 5s linear forwards; }
    .auto-note.calm .timer { display: none; }
    @keyframes shrinkBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    .jump-pill { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: var(--field); border: 1px solid var(--line); border-radius: var(--radius-pill);
      padding: 7px 14px; font-size: 13px; color: var(--accent-text);
      box-shadow: 0 2px 8px rgba(60,40,20,.12); }

    .composer { background: var(--card); border-top: 1px solid var(--line); padding: 8px 12px; }
    .composer-note { display: flex; align-items: center; gap: 5px; min-height: 32px;
      font-size: 11px; color: var(--ink-soft); background: none; border: 0; padding: 0;
      width: 100%; text-align: left; }
    .composer-row { display: flex; align-items: flex-end; gap: 8px; }
    .composer textarea { flex: 1; min-width: 0; min-height: 38px; max-height: 110px; resize: none;
      /* 16px 是硬要求：iOS 上小于 16px 会在聚焦时自动放大页面 */
      font-size: 16px; line-height: 1.45; padding: 9px 13px; border-radius: var(--radius-lg);
      border: 1px solid var(--line); background: var(--field); color: var(--ink);
      font-family: inherit; overflow-y: auto; }
    .send-btn { flex: none; width: 36px; height: 36px; border-radius: var(--radius-pill); border: 0;
      background: var(--accent-strong); color: #fff; position: relative;
      display: flex; align-items: center; justify-content: center; }
    .send-btn::after { content: ''; position: absolute; left: -4px; right: -4px; top: -4px; bottom: -4px; }
    .send-btn:disabled { background: var(--line); color: var(--ink-soft); }

    .ask-empty { text-align: center; padding: 40px 24px; }
    .ask-empty .tile { width: 56px; height: 56px; border-radius: var(--radius); margin: 0 auto 16px;
      background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center; }
    .ask-empty h4 { margin: 0 0 8px; font-size: 17px; font-weight: 500; }
    .ask-empty p { margin: 0 auto 20px; max-width: 26em; font-size: 13px; line-height: 1.7; color: var(--ink-soft); }
    .ask-empty .cta { padding: 12px 18px; font-size: 15px; border: 0; border-radius: var(--radius-sm);
      background: var(--accent-strong); color: #fff; }
    .ask-empty .sub { display: inline-block; margin-top: 4px; padding: 12px; font-size: 13px;
      color: var(--ink-soft); background: none; border: 0; }
    .ask-empty .foot { margin-top: 16px; font-size: 11px; color: var(--ink-soft); }
    .ask-persona { display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left; }
    .ask-persona .tile { width: 36px; height: 36px; border-radius: var(--radius-md); margin: 0; }
    .ask-persona .nm { font-size: 15px; font-weight: 600; }
    .ask-persona .ds { font-size: 12px; color: var(--ink-soft); }
    .suggest { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px;
      padding: 11px 14px; font-size: 15px; color: var(--ink); text-align: left;
      background: var(--card); border: 0; }
    .suggest .ar { margin-left: auto; flex: none; color: var(--ink-soft); }
    .suggest + .suggest { border-top: 1px solid var(--line); }

    /* ===== AI 设置（更多页）===== */
    .ask-section { break-inside: avoid; }
    .cfg-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px;
      padding: 8px 14px; background: var(--card); border: 0; text-align: left; color: var(--ink); }
    .cfg-tile { flex: none; width: 36px; height: 36px; border-radius: var(--radius-md);
      background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center; }
    .cfg-row .cfgtxt { flex: 1; min-width: 0; }
    .cfg-row .cfgnm { font-size: 15px; }
    .cfg-row .cfgst { font-size: 12px; color: var(--ink-soft); }
    .cfg-row .ar { flex: none; color: var(--ink-soft); }
    .chip-row { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding-bottom: 2px; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip-row .cat-chip, .snap-chips .cat-chip { flex: none; padding: 12px 14px; border-radius: var(--radius-pill); }
    .field-with-btn { position: relative; }
    .field-with-btn .input { width: 100%; padding-right: 46px; }
    .field-with-btn .in-btn { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); }
    .test-result { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-md);
      background: var(--field-soft); border: 1px solid var(--line); }
    .test-result .sync-state { white-space: normal; font-size: 13px; }
    .result-body { margin-top: 6px; font-size: 12px; line-height: 1.6; color: var(--ink-soft); }
    .result-act { margin-top: 8px; }
    .http-code { display: inline-block; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px; background: var(--field); border: 1px solid var(--line);
      border-radius: var(--radius-xs); padding: 1px 5px; }
    .persona { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 12px 2px;
      background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; color: var(--ink); }
    .persona:last-of-type { border-bottom: 0; }
    .pick { flex: none; width: 20px; height: 20px; margin-top: 2px; border-radius: 50%;
      border: 1.5px solid var(--line); background: var(--field);
      display: flex; align-items: center; justify-content: center; color: #fff; }
    .pick.on { background: var(--accent-strong); border-color: var(--accent-strong); }
    .pick svg { opacity: 0; }
    .pick.on svg { opacity: 1; }
    .persona .pn { display: block; font-size: 15px; }
    .persona .pd { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-soft); }
    .persona-custom { margin: 8px 0 0 30px; }
    .switch-note { display: flex; align-items: flex-start; gap: 6px; margin-top: 10px;
      font-size: 12px; line-height: 1.6; color: var(--ink-soft); }
    .switch-note svg { flex: none; margin-top: 2px; }
    .disclose { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px;
      padding: 11px 14px; background: var(--card); border: 0; font-size: 15px;
      color: var(--ink); text-align: left; }
    .disclose .ar { margin-left: auto; flex: none; color: var(--ink-soft); }

    @media (prefers-reduced-motion: reduce) {
      .typing .dots i { animation: none; opacity: .5; }
      .timer i { animation: none; }
    }
  </style>
</head>
<body>
  <!-- 首屏：登录 / 注册 -->
  <div id="auth">
    <div class="auth-brand">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>
          <path d="M8.5 14.5l2 2 4-4"/>
        </svg>
      </div>
      <h1>小计划</h1>
      <p>两个人，把日子一件件过完</p>
    </div>

    <div class="auth-tabs">
      <button id="tabLogin" class="on">登录</button>
      <button id="tabSignup">注册</button>
    </div>

    <div class="auth-card">
      <div class="field">
        <label>邮箱</label>
        <input id="auEmail" type="email" placeholder="you@example.com" autocapitalize="off" autocorrect="off" autocomplete="email"/>
      </div>
      <div class="field" id="fName" style="display:none">
        <label>昵称（选填）</label>
        <input id="auName" type="text" placeholder="ta 看到的名字" autocomplete="nickname"/>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="auPass" type="password" placeholder="至少 6 位" autocomplete="current-password"/>
      </div>
      <div class="field" id="fPass2" style="display:none">
        <label>确认密码</label>
        <input id="auPass2" type="password" placeholder="再输一次" autocomplete="new-password"/>
      </div>
      <div class="auth-row">
        <label class="cb"><input type="checkbox" id="auAuto" checked/>自动登录</label>
        <span class="muted" style="font-size:12px">下次打开直接进入</span>
      </div>
      <div class="auth-err" id="auErr"></div>
      <button class="block" id="auSubmit">登录</button>
    </div>

    <div class="auth-foot">
      <button class="linkbtn" id="auGuest">先随便看看（数据只存本机）</button>
    </div>
    <div class="auth-tip">注册后自动登录。两人各注册一个账号，<br/>在「更多 → 已登录」里配对，就能共享了。</div>
  </div>

  <div class="topbar">
    <h1 id="viewTitle">今日</h1>
    <div class="right">
      <span class="date" id="todayLabel"></span>
      <span class="sync-state" id="syncState"></span>
      <button class="soft sm" id="accountBtn">登录</button>
    </div>
  </div>

  <div class="wrap" id="app"></div>

  <!-- 问问的对话层：刻意放在 #app 外面，见 CSS 里 .chat-layer 的注释 -->
  <div class="chat-layer" id="chatLayer" hidden>
    <div class="chat-shell">
      <div class="chat-body">
        <div class="chat-scroll" id="chatScroll"><div class="chat-pad" id="chatPad"></div></div>
        <button class="jump-pill" id="jumpPill" hidden>↓ 新的内容</button>
      </div>
      <div class="composer">
        <button class="composer-note" id="aiNote" type="button"></button>
        <div class="composer-row">
          <textarea id="aiInput" rows="1" placeholder="问一句，或者让它排几件事"></textarea>
          <button class="send-btn" id="aiSend" type="button" aria-label="发送"></button>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
  <div id="toast"></div>

  <script>
  /* ============ 存储（本机个人数据，兼作云端缓存） ============ */
  const KEY = 'planapp_v1';
  const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays = (s,n) => { const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return fmt(d); };
  // 周X，只用于「明天 · 周X」徽标文案；不碰存储
  const weekday = d => ['日','一','二','三','四','五','六'][new Date(d + 'T00:00:00').getDay()];
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  /* ============ 预设主题（设备本地，不同步，避免两人界面不一致） ============ */
  const THEMES = [
    { id:'apricot', name:'米杏', bg:'#f6f1ea', card:'#fffdfa', line:'#ece4d8', accent:'#c2774f', accentSoft:'#f3e3d8', accentText:'#8a5733', accentStrong:'#a8603b', dot:'rgba(194,119,79,.20)', accentSoftDark:'#3d2f27', accentTextDark:'#e2a582', dotDark:'rgba(194,119,79,.28)' },
    { id:'mist',    name:'雾蓝', bg:'#eef2f5', card:'#fbfdfe', line:'#dde6ec', accent:'#5b8aa6', accentSoft:'#e2edf2', accentText:'#3f6b85', accentStrong:'#3f6b85', dot:'rgba(91,138,166,.20)', accentSoftDark:'#243341', accentTextDark:'#9fc6de', dotDark:'rgba(91,138,166,.28)' },
    { id:'matcha',  name:'抹茶', bg:'#eef3ea', card:'#fbfdfa', line:'#dde7d6', accent:'#6f9b6e', accentSoft:'#e3eee1', accentText:'#4d734c', accentStrong:'#4d734c', dot:'rgba(111,155,110,.20)', accentSoftDark:'#26362a', accentTextDark:'#a9cda7', dotDark:'rgba(111,155,110,.28)' },
    { id:'rose',    name:'藕粉', bg:'#f7eef2', card:'#fefbfc', line:'#ecdfe6', accent:'#b07a93', accentSoft:'#f3e6ec', accentText:'#8a566e', accentStrong:'#8a566e', dot:'rgba(176,122,147,.20)', accentSoftDark:'#3a2b34', accentTextDark:'#e0aac3', dotDark:'rgba(176,122,147,.28)' },
  ];
  const THEME_KEY = 'planapp_theme';
  const DARK_KEY  = 'planapp_dark';   // 'auto' 跟随系统 | 'on' 总深色 | 'off' 总浅色
  function isDarkOn(){
    const pref = localStorage.getItem(DARK_KEY) || 'auto';
    const sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    return pref==='on' || (pref==='auto' && sysDark);
  }
  function applyTheme(id){
    const t = THEMES.find(x=>x.id===id) || THEMES[0];
    const r = document.documentElement.style;
    const dark = isDarkOn();
    // 深色只覆盖底色/文字/描边；品牌强调色沿用所选主题，深色下换成提亮版
    r.setProperty('--bg', dark ? '#1c1a18' : t.bg);
    r.setProperty('--card', dark ? '#252220' : t.card);
    r.setProperty('--field', dark ? '#2f2b28' : t.card);
    r.setProperty('--field-soft', dark ? '#2a2624' : t.line);
    r.setProperty('--line', dark ? '#3a3633' : t.line);
    r.setProperty('--accent', t.accent);
    r.setProperty('--accent-soft', dark ? t.accentSoftDark : t.accentSoft);
    r.setProperty('--accent-text', dark ? t.accentTextDark : t.accentText);
    r.setProperty('--accent-strong', t.accentStrong);
    r.setProperty('--dot', dark ? t.dotDark : t.dot);
    if(dark){
      r.setProperty('--ink', '#ece6df');
      r.setProperty('--ink-soft', '#a89e94');
      r.setProperty('--mask', 'rgba(0,0,0,.55)');
      r.setProperty('color-scheme', 'dark');
      // 原 --danger #b4483c 在深色卡片 #252220 上只有 3.0:1，13px 正文不达 AA
      r.setProperty('--danger', '#d4786a');
    } else {
      r.setProperty('--ink', '#2c2722');
      r.setProperty('--ink-soft', '#726859');
      r.setProperty('--mask', 'rgba(40,30,20,.4)');
      r.setProperty('color-scheme', 'light');
      r.setProperty('--danger', '#b4483c');
    }
    try { localStorage.setItem(THEME_KEY, t.id); } catch(e){}
  }
  function loadTheme(){

  }
  const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const CATS = [
    { id:'work',   name:'工作', color:'#5b8aa6' },
    { id:'life',   name:'生活', color:'#c2774f' },
    { id:'health', name:'健康', color:'#6f9b6e' },
    { id:'heart',  name:'情感', color:'#b07a93' },
  ];
  let curCat = 'life';
  const HABIT_PRESETS = ['喝水 8 杯','运动 30 分钟','读书 20 页','23 点前睡','记账','冥想 10 分钟'];

  // 本机状态键 → 云端表名。定义在这里而不是同步引擎那边，是因为 save() 的配额降级
  // 要遍历它；const 有 TDZ，放在 400 行以后会让 save() 在启动早期引用报错。
  const PLAN_TABLES = { yearGoals:'year_goals', monthGoals:'month_goals', tasks:'tasks', habits:'habits', specialDates:'special_dates' };

  function defaultState(){
    return { yearGoals:[], monthGoals:[], tasks:[], habits:[], specialDates:[],
             pendingDeletes:[],   // 待从云端删除的记录
             ownerId: null,       // 这批本机数据属于哪个账号（换账号时用来判断要不要清空）
             warmMessage:{text:'',updatedAt:null},
             whispers:[], sharedList:[], cleared:{} };
  }
  const loadLocal = () => { try { return Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY))||{}); } catch(e){ return defaultState(); } };
  let S = loadLocal();

  /* ---------- 持久化：配额溢出时分级降级，绝不抛异常 ----------
     save() 被 render / flushPending / pullPlans / adoptLocalData 到处调用，
     一旦抛出 QuotaExceededError，整条同步链会当场断掉且用户毫无感知。 */
  const QUOTA_KEYS = /QuotaExceededError|NS_ERROR_DOM_QUOTA_REACHED|quota/i;
  const isQuotaErr = e => !!e && (QUOTA_KEYS.test(e.name || '') || QUOTA_KEYS.test(String(e.message || ''))
                                 || e.code === 22 || e.code === 1014);
  let _quotaWarned = false;
  function tryWrite(){ try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch(e){ return e; } }

  let save = () => {
    let e = tryWrite();
    if(e === true) return true;
    if(!isQuotaErr(e)){ console.warn('save 失败（非配额问题）', e); return false; }

    // L1 丢掉纯内存的瞬时字段（失败重试计数，丢了不影响正确性）
    Object.keys(PLAN_TABLES).forEach(k => (S[k] || []).forEach(r => { delete r._retryCount; }));
    if((e = tryWrite()) === true) return true;
    if(!isQuotaErr(e)){ console.warn('save 失败（非配额问题）', e); return false; }

    // L2 清掉 30 天前的删除队列。云端已生效的删除不需要本地兜底；
    //    没同步成功的会一直重试，30 天还没成功的基本是死记录。
    const cut = Date.now() - 30 * 864e5;
    S.pendingDeletes = (S.pendingDeletes || []).filter(d => (d.at || 0) > cut);
    if((e = tryWrite()) === true) return true;
    if(!isQuotaErr(e)){ console.warn('save 失败（非配额问题）', e); return false; }

    // L3 归档一年前已完结的任务。云端才是持久层，本地只留活跃数据用于快速渲染。
    const ago = fmt(new Date(Date.now() - 365 * 864e5));
    S.tasks = S.tasks.filter(t => !((t.status === 'done' || t.status === 'skipped')
                                    && (t.currentDate || '') < ago));
    if((e = tryWrite()) === true){ toast('本地空间不足，已归档一年前的历史任务'); return true; }
    if(!isQuotaErr(e)){ console.warn('save 失败（非配额问题）', e); return false; }

    // L4 彻底写不进去：转纯内存模式。
    //    关键 —— 绝不能清空 S[k]！清空会让下次 mergeRows 认为「本机已删」，
    //    反而把还没同步上去的改动丢掉。数据还在内存里，立刻推云端保命。
    if(!_quotaWarned){ _quotaWarned = true; toast('本地存储已满，改动暂存在当前页面'); }
    if(cloudMode()) flushPending();
    return false;
  };

  /* ============ 换账号时的数据归属 ============ */
  // 退出登录原来不清 S，导致下一个账号登录后，上一个人的数据被当成「本机数据」上传，
  // 直接污染新账号。这里记住数据属于谁，换人就清空。
  // 首次登录（ownerId 为空）不清 —— 那是离线模式下攒的数据，应该归给这个账号。
  function adoptLocalData(uid){
    if(S.ownerId && S.ownerId !== uid) S = defaultState();
    S.ownerId = uid;
    save();
  }

  /* ============ 用户设置（warmMessage + cleared 同步） ============ */
  async function loadUserSettings(){

  // save() 也触发云端设置同步（warmMessage/cleared 很少变，无性能问题）
  const _origSave = save;

  /* ============ Supabase（公开 anon key，仅用于前端登录与两人共享） ============ */
  const SB_URL = 'https://hoofhoblsbnivtbxqduq.supabase.co';

  let sb = null, me = null, myRel = null, partnerId = null;

  // 自己的计划数据：登录后立刻订阅，不依赖配对 —— 多设备同步靠这条
  function startRealtimeSelf(){
    if(rtSelf || !sb || !me) return;
    rtSelf = sb.channel('self-'+me.id);
    Object.values(PLAN_TABLES).forEach(t =>
      rtSelf.on('postgres_changes', { event:'*', schema:'public', table:t }, debouncedPull));

  function startRealtimeRel(){

      .on('postgres_changes', { event:'*', schema:'public', table:'whispers' }, refreshCloud)

      .subscribe();

  function stopRealtime(){
    if(rtSelf){ sb?.removeChannel(rtSelf); rtSelf = null; }
    if(rtRel){ sb?.removeChannel(rtRel); rtRel = null; }
  }

  /* ============ 云端计划数据层（年/月/日/习惯/特别日子） ============ */
  // 云端主键是 uuid，本机 uid() 生成的是短 id。没成功上云前拿短 id 去查 uuid 列会报
  // invalid input syntax for type uuid，所以所有云端操作前都要过这道闸
  const isUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s || '');

  // 合并的依据：updatedAt 是客户端逻辑时间（毫秒），两边比大小，谁新谁赢
  function toCloud(kind, r){
    const base = {
      user_id: me.id,                                                  // RLS 要求，必须显式带上
      updated_at: new Date(r.updatedAt || Date.now()).toISOString(),
    };
    switch(kind){
      case 'yearGoals':   return { ...base, title:r.title, description:r.desc, year:r.year };
      case 'monthGoals':  return { ...base, title:r.title, month:r.month, year_goal_id:r.yearGoalId||null };
      // done_time 是 timestamptz，必须传 ISO 字符串。直接传 Date.now() 的毫秒数字
      // Postgres 会报 22008 date/time field value out of range —— 勾完成就永远同步不上
      case 'tasks':       return { ...base, title:r.title, status:r.status, created_date:r.createdDate, plan_date:r.currentDate, original_date:r.originalDate, done_time: r.doneTime ? new Date(r.doneTime).toISOString() : null, delay_count:r.delayCount };
      case 'habits':      return { ...base, name:r.name, done_dates:r.doneDates };
      case 'specialDates':return { ...base, title:r.title, date:r.date };
    }
  }
  function fromCloud(kind, r){
    const t = r.updated_at ? new Date(r.updated_at).getTime() : 0;
    switch(kind){
      case 'yearGoals':   return { id:r.id, title:r.title, desc:r.description, year:r.year, updatedAt:t };
      case 'monthGoals':  return { id:r.id, title:r.title, month:r.month, yearGoalId:r.year_goal_id, updatedAt:t };
      case 'tasks':       return { id:r.id, title:r.title, status:r.status, createdDate:r.created_date, currentDate:r.plan_date, originalDate:r.original_date, doneTime: r.done_time ? new Date(r.done_time).getTime() : null, delayCount:r.delay_count, updatedAt:t };
      case 'habits':      return { id:r.id, name:r.name, doneDates:r.done_dates||[], updatedAt:t };
      case 'specialDates':return { id:r.id, title:r.title, date:r.date, updatedAt:t };
    }
  }
  // 本地新增：先入本机，云端模式再插入并回填云 id
  // 三个写操作统一：先落本机 + 打待传标记，再交给 flushPending 补传。
  // 断网时请求失败，标记留着不动，联网后自动重试 —— 改动不会丢。
  async function syncInsert(kind, row){
    row.updatedAt = Date.now();
    row.cloudPending = true;
    row._retryCount = 0;                          // 失败重试计数，防止死循环
    S[kind].push(row); save();
    await flushPending();
  }
  async function syncUpdate(kind, row){
    row.updatedAt = Date.now();
    row.cloudPending = true;
    row._retryCount = 0;
    save();
    await flushPending();
  }
  async function syncDelete(kind, id){
    const row = S[kind].find(x => x.id === id);
    // 只有已经上过云（uuid）的才需要去云端删；短 id 云端本来就没有，
    // 加进队列只会让 flushPending 反复拿短 id 去查 uuid 列报类型转换错
    // at 是入队时间：save() 配额降级时靠它清掉 30 天前的死队列
    if(row && isUuid(row.id)) S.pendingDeletes.push({ kind, id: row.id, at: Date.now() });
    S[kind] = S[kind].filter(x => x.id !== id);
    save();
    await flushPending();
  }

  /* ---------- 待同步队列 ---------- */
  let flushing = false;
  // 同步失败：网络问题静默等重试；数据/权限问题重试也没用，要明确告诉用户。
  // 关键：无论哪种都保留 cloudPending 标记，绝不静默丢弃 —— 之前「3 次后清标记」
  // 正是让 done_time 类型错误被彻底掩盖、数据悄悄不同步的原因。
  function onSyncFail(kind, r, error){
    r._retryCount = (r._retryCount || 0) + 1;
    const msg = (error && error.message) || String(error || '');
    const isNet = /Failed to fetch|NetworkError|fetch failed|network|timeout/i.test(msg);
    if(!isNet){
      syncState = 'error'; updateSyncUI();
      if(r._retryCount === 1){
        toast('有内容没同步上去，看控制台');
        console.error('[sync] 非网络错误，重试无用：', kind, r, error);
      }
    }
  }
  async function flushPending(){
    if(!cloudMode() || flushing) return;
    flushing = true;
    try {
      // 先把所有待传行收集为 {kind, row} 对（避免 S[kind] 被 pullPlans 替换引用）
      const pending = [];
      for(const kind of Object.keys(PLAN_TABLES)){
        for(const r of S[kind]){
          if(r.cloudPending){ pending.push({ kind, row: r }); }
        }
      }
      for(const { kind, row: r } of pending){
        if(!cloudMode()) break;                    // 中途断网，停止处理
        try {
          if(isUuid(r.id)){
            const { error } = await sb.from(PLAN_TABLES[kind]).update(toCloud(kind, r)).eq('id', r.id);
            if(error){ onSyncFail(kind, r, error); continue; }
          } else {
            const { data, error } = await sb.from(PLAN_TABLES[kind]).insert(toCloud(kind, r)).select().single();
            if(error){ onSyncFail(kind, r, error); continue; }
            r.id = data.id;
          }
          delete r.cloudPending; delete r._retryCount; save();
        } catch(e){ onSyncFail(kind, r, e); }
      }
      if(S.pendingDeletes.length && cloudMode()){
        const rest = [];
        for(const d of S.pendingDeletes){
          if(!isUuid(d.id)) continue;               // 云端没有这条，无需删除，丢弃即可
          try {
            const { error } = await sb.from(PLAN_TABLES[d.kind]).delete().eq('id', d.id);
            if(error){ onSyncFail(d.kind, d, error); rest.push(d); }
          } catch(e){ onSyncFail(d.kind, d, e); rest.push(d); }
        }
        S.pendingDeletes = rest; save();
      }
    } finally { flushing = false; }
  }

  /* ---------- 拉取与合并 ---------- */
  let syncing = false, pullT = null;
  let syncState = 'off';   // off | syncing | ok | error
  function debouncedPull(){ clearTimeout(pullT); pullT = setTimeout(runSync, 500); }
  // 顶部状态点：让用户看得见同步到底成没成（之前是纯黑盒，失败只 toast 一句）
  function updateSyncUI(){
    const ss = document.getElementById('syncState'); if(!ss) return;
    if(!me){ ss.style.display='none'; return; }
    ss.style.display = '';
    ss.className = 'sync-state ' + (syncState==='syncing' ? 'syncing' : syncState==='error' ? 'err' : 'ok');
    ss.textContent = syncState==='syncing' ? '同步中…' : syncState==='error' ? '同步失败' : (cloudReady ? '已同步' : '已登录');
  }
  // 顺序要紧：先把本机改动推上去，再拉云端，否则本机刚改的会被判成过期数据
  async function runSync(){
    syncState = 'syncing'; updateSyncUI();
    try {
      await flushPending();
      await pullPlans();
      await flushPending();
      syncState = 'ok';
    } catch(e){
      syncState = 'error';
      console.warn('runSync 失败', e);
    }
    updateSyncUI();
  }

  // 双向合并：本机有未上传改动 → 本机赢；否则比 updatedAt，谁新谁赢；云端独有的补进来
  function mergeRows(localRows, cloudRows){
    const cloudById = new Map(cloudRows.map(r => [r.id, r]));
    const out = [];
    for(const local of localRows){
      if(local.cloudPending){
        // 本机新增但还没上传：保留，不让云端旧版覆盖
        // 如果是短 id，说明还没上云，必须保留（云端的同标题是无关记录）
        if(isUuid(local.id)){
          cloudById.delete(local.id);               // 从云端里排除，避免重复
        }
        out.push(local);
        continue;
      }
      const c = cloudById.get(local.id);
      if(c) cloudById.delete(local.id);
      if(!c) continue;                              // 云端已删 → 本机跟着删
      out.push((c.updatedAt || 0) > (local.updatedAt || 0) ? c : local);
    }
    for(const c of cloudById.values()) out.push(c);  // 别的设备新增的
    return out;
  }

  async function pullPlans(){
    if(!cloudMode() || syncing) return;
    syncing = true;
    let err = false;
    try {
      const [yg, mg, tk, hb, sd] = await Promise.all([
        sb.from('year_goals').select('*'),
        sb.from('month_goals').select('*'),
        sb.from('tasks').select('*'),
        sb.from('habits').select('*'),
        sb.from('special_dates').select('*'),
      ]);
      // 从没上过云的老数据（短 id）也标成待传，免得被当成「云端已删」给丢掉
      Object.keys(PLAN_TABLES).forEach(k => S[k].forEach(r => {
        if(!isUuid(r.id) && !r.cloudPending){ r.cloudPending = true; r.updatedAt = r.updatedAt || Date.now(); }
      }));
      Object.assign(S, {
        yearGoals:    mergeRows(S.yearGoals,    (yg.data||[]).map(r => fromCloud('yearGoals', r))),
        monthGoals:   mergeRows(S.monthGoals,   (mg.data||[]).map(r => fromCloud('monthGoals', r))),
        tasks:        mergeRows(S.tasks,        (tk.data||[]).map(r => fromCloud('tasks', r))),
        habits:       mergeRows(S.habits,       (hb.data||[]).map(r => fromCloud('habits', r))),
        specialDates: mergeRows(S.specialDates, (sd.data||[]).map(r => fromCloud('specialDates', r))),
      });
      save();
    } catch(e){ err = true; console.warn('pullPlans 失败', e); }
    finally {
      syncing = false;
      if(!err && cloudMode()) syncState = 'ok';   // runSync 会再统一判断，这里兜底独立调用的情况
      render();
    }
  }

  /* ============ 工具 ============ */
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
  function openSheet(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('mask').classList.add('show'); }
  function closeSheet(){ document.getElementById('mask').classList.remove('show'); }
  document.getElementById('mask').addEventListener('click', e => { if(e.target.id==='mask') closeSheet(); });
  const v = id => (document.getElementById(id)?.value || '').trim();

  /* ============ 登录 / 注册（首屏） ============ */
  const AUTH_KEY = 'planapp_auth';
  const byId = id => document.getElementById(id);
  function authPref(){
    try { return Object.assign({ autoLogin:true, email:'' }, JSON.parse(localStorage.getItem(AUTH_KEY)) || {}); }
    catch(e){ return { autoLogin:true, email:'' }; }
  }
  function saveAuthPref(p){ try { localStorage.setItem(AUTH_KEY, JSON.stringify(Object.assign(authPref(), p))); } catch(e){} }

  let authMode = 'login', guest = false;   // guest：离线试用，不强制登录

  function setAuthErr(m){ byId('auErr').textContent = m || ''; }
  function showAuth(msg){ byId('auth').classList.remove('hide'); if(msg) setAuthErr(msg); }
  function hideAuth(){ byId('auth').classList.add('hide'); setAuthErr(''); }

  function setAuthMode(m){
    authMode = m;
    byId('tabLogin').classList.toggle('on', m === 'login');
    byId('tabSignup').classList.toggle('on', m === 'signup');
    byId('fName').style.display  = (m === 'signup') ? '' : 'none';
    byId('fPass2').style.display = (m === 'signup') ? '' : 'none';
    byId('auPass').autocomplete  = (m === 'signup') ? 'new-password' : 'current-password';
    authBusy(false);
    setAuthErr('');
  }
  function authBusy(on, text){
    const b = byId('auSubmit');
    b.disabled = !!on;
    b.textContent = on ? (text || '请稍候…') : (authMode === 'login' ? '登录' : '注册并进入');
  }

  function friendlyAuthError(e){
    const m = (e && e.message) ? e.message : String(e || '出错了');
    if(/Invalid login credentials/i.test(m))      return '邮箱或密码不对';
    if(/Email not confirmed/i.test(m))            return '邮箱还没确认，去收件箱点一下链接';
    if(/already registered|already been registered/i.test(m)) return '这个邮箱注册过了，切到「登录」吧';
    if(/Password should be at least/i.test(m))    return '密码至少 6 位';
    if(/rate limit|security purposes/i.test(m))    return '试得太频繁，稍等一会儿再来';
    if(/unable to validate email|invalid format/i.test(m)) return '邮箱格式不太对';
    if(/Failed to fetch|NetworkError|fetch/i.test(m)) return '网络连不上，检查一下网络';
    return m;
  }

  function ensureClient(){
    if(!window.supabase) return null;
    if(!sb) sb = window.supabase.createClient(SB_URL, SB_ANON, { auth: { persistSession: true, autoRefreshToken: true } });
    return sb;
  }

  async function doAuth(){
    const email = byId('auEmail').value.trim();
    const pass  = byId('auPass').value;
    setAuthErr('');
    if(!/^\S+@\S+\.\S+$/.test(email)) return setAuthErr('邮箱格式不太对');
    if(pass.length < 6)               return setAuthErr('密码至少 6 位');
    if(authMode === 'signup' && pass !== byId('auPass2').value) return setAuthErr('两次输入的密码不一致');

    if(!ensureClient()) return setAuthErr('网络不可用，可先点下面「先随便看看」');

    const auto = byId('auAuto').checked;
    saveAuthPref({ autoLogin: auto, email: auto ? email : '' });

    authBusy(true, authMode === 'login' ? '登录中…' : '注册中…');
    try {
      if(authMode === 'login'){
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if(error){ authBusy(false); return setAuthErr(friendlyAuthError(error)); }
        toast('欢迎回来');
      } else {
        const name = byId('auName').value.trim() || email.split('@')[0];
        const { data, error } = await sb.auth.signUp({
          email, password: pass,
          options: { data: { display_name: name } }
        });
        if(error){ authBusy(false); return setAuthErr(friendlyAuthError(error)); }
        if(!data.session){          // 服务端要求邮箱确认
          authBusy(false); setAuthMode('login');
          return setAuthErr('注册成功，去邮箱点确认后再登录');
        }
        // 触发器会建 profiles 行，这里兜底把昵称写准（失败也不该挡住登录）
        try { await sb.from('profiles').upsert({ id: data.user.id, display_name: name }, { onConflict: 'id' }); }
        catch(e){ console.warn('写 profiles 失败', e); }
        toast('注册成功，已登录');
      }
      guest = false;
      hideAuth();
    } catch(err){
      authBusy(false);
      setAuthErr(friendlyAuthError(err));
    }
  }

  /* ============ 今日 ============ */
  function todays(){ const t=todayStr(); return S.tasks.filter(x=>x.currentDate===t); }
  // 明日计划：明天待办的那批。只筛 todo/delayed —— 做完/偷懒的已经闭环，
  // 不该占着"还没交代的明天"。纯靠 currentDate 筛选，不新增任何字段。
  function tomorrows(){
    const tmr = addDays(todayStr(), 1);
    return S.tasks.filter(x => x.currentDate === tmr && (x.status === 'todo' || x.status === 'delayed'));
  }
  let tmrOpen = null;    // null=自动（今日已收尾则展开，接住睡前规划），true/false=用户手动切过
  let tmrAll  = false;   // 是否"展开全部"（就地展开，不切视图、不进 TABS）
  function viewToday(){
    const t=todayStr();
    const delayed = todays().filter(x=>x.status==='delayed');
    const todo = todays().filter(x=>x.status==='todo');
    const done = todays().filter(x=>x.status==='done');
    const skipped = todays().filter(x=>x.status==='skipped');
    const cleared = S.cleared[t];
    const total = todo.length + done.length + skipped.length + delayed.length;
    const pct = total ? Math.round(done.length / total * 100) : 0;
    const bar = total ? '█'.repeat(Math.round(pct / 10)) + '░'.repeat(10 - Math.round(pct / 10)) : '░░░░░░░░░░';
    let h = '';
    if(cleared) h += `<div class="cleared-banner">今天已经收尾啦 · 明天见</div>`;
    if(total && !cleared) h += `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div><span class="progress-text">${done.length}/${total} · ${pct}%</span></div>`;

    h += `<div class="section-title">延期 · 从之前挪来</div>`;
    if(delayed.length) delayed.forEach(x=>h+=taskRow(x,true)); else h+=`<div class="empty">没有延期的事，轻松。</div>`;

    h += `<div class="section-title">今日待办</div>`;
    if(todo.length) todo.forEach(x=>h+=taskRow(x,false)); else h+=`<div class="empty">还没有安排，加一件小事吧。</div>`;

    h += `<div class="card">
      <div class="cat-chips">${CATS.map(c=>`<button type="button" class="cat-chip${c.id===curCat?' on':''}" data-cat="${c.id}" style="--c:${c.color}">${c.name}</button>`).join('')}</div>
      <div class="row"><input id="newTask" type="text" placeholder="加一件今天要做的事…" /><button class="sm" id="addTask">加</button></div>
    </div>`;

    if(done.length){
      h += `<div class="section-title">已完成</div>`;
      done.forEach(x=>h+=taskRow(x,false));
    }
    if(skipped.length){
      h += `<div class="section-title">今天偷的懒</div>`;
      skipped.forEach(x=>h+=taskRow(x,false));
    }
    h += `<div class="card"><button class="block soft" id="clearBtn">收尾今天</button></div>`;
    h += `<div class="muted" style="text-align:center;margin-top:6px">点左侧圆圈可以随时改状态；收尾时再给剩下的选个结尾。</div>`;
    h += viewTomorrowCard();   // 收尾完之后，顺手排明天
    return h;
  }
  // ctx='tmr' 时给标题后追加「明天 · 周X」徽标；今日上下文不传，行为完全不变
  function taskRow(x, isDelayed, ctx){
    const cat = CATS.find(c=>c.id===x.category) || CATS[1];
    const st = x.status;
    const cls = st==='done' ? 'done' : (st==='skipped' ? 'skipped' : (isDelayed ? 'delayed' : ''));
    const sub = isDelayed ? `<div class="muted" style="font-size:12px">原 ${x.originalDate} · 已延期 ${x.delayCount} 次</div>` : '';
    // 偷懒的给个「恢复」入口，可以反悔把它放回待办
    const restore = st==='skipped'
      ? `<button class="iconbtn" data-act="restore" aria-label="恢复">
           <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>
         </button>`
      : '';
    // 圆圈里的记号：完成=勾，延期=右尖角（往后挪），偷懒=横线
    const stMark = st==='done' ? '✓' : (st==='delayed' ? '›' : (st==='skipped' ? '–' : ''));
    return `<div class="task ${cls}" data-id="${x.id}">
      <div class="check ${st==='done'?'on':''}" data-act="toggle"><span class="st">${stMark}</span></div>
      <div class="label grow"><span class="cat-dot" style="background:${cat.color}"></span>${esc(x.title)}${ctx==='tmr'?`<span class="date-badge">明天 · 周${weekday(x.currentDate)}</span>`:''}${sub}</div>
      <div class="small-actions">${restore}
        <button class="iconbtn" data-act="edit" aria-label="编辑">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="iconbtn" data-act="del" aria-label="删除">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
        </button>
      </div>
    </div>`;
  }
  /* 明日计划：今日视图底部的一张内联卡片。不新增 tab、不新增存储，
     纯靠 currentDate 筛选。卡片里每一行就是 taskRow，状态/编辑/删除
     全部走既有的 .task 事件绑定，零新增交互。                        */
  function viewTomorrowCard(){
    const list  = tomorrows();
    const open  = tmrOpen === null ? !!S.cleared[todayStr()] : tmrOpen;
    const shown = (tmrAll || list.length <= 3) ? list : list.slice(0, 3);
    const n = list.length;
    const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>';
    const CHEV = '<path d="M6 9l6 6 6-6"/>';
    let h = `<div class="card tmr-card${open ? ' open' : ''}">
      <button class="tmr-head" id="tmrToggle" type="button">
        <span class="tmr-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${MOON}</svg></span>
        <span class="grow">明天的计划 · ${n ? n + ' 件' : '还没安排'}</span>
        <span class="tmr-ar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${CHEV}</svg></span>
      </button>`;
    if(open){
      h += `<div class="tmr-body">`;
      if(n){
        shown.forEach(x => { h += taskRow(x, false, 'tmr'); });
        if(list.length > shown.length)
          h += `<button class="tmr-more" id="tmrMore" type="button">展开全部 ${list.length} 件</button>`;
      } else {
        h += `<div class="empty">睡前想好明天做哪几件，明早起来就有着落。</div>`;
      }
      h += `<div class="row"><input id="newTaskTmr" type="text" placeholder="加一件明天要做的事…" /><button class="sm" id="addTaskTmr">加</button></div>`;
      h += `</div>`;
    }
    return h + `</div>`;
  }
  function bindView(){
    const addT = document.getElementById('addTask');
    if(addT) addT.onclick = () => { const i=document.getElementById('newTask'); const t=i.value.trim(); if(!t) return; const row={id:uid(),title:t,status:'todo',category:curCat,createdDate:todayStr(),currentDate:todayStr(),originalDate:todayStr(),doneTime:null,delayCount:0}; syncInsert('tasks', row).then(()=>{ i.value=''; i.focus(); }); };
    const nt = document.getElementById('newTask');
    if(nt) nt.onkeydown = e => { if(e.key==='Enter') addT.click(); };
    // 明日计划：row 与今日添加只差 currentDate/originalDate 取明天，其余字段逐字一致，
    // 走同一个 syncInsert —— 绝不自己 push + save
    const addTmr = document.getElementById('addTaskTmr');
    if(addTmr) addTmr.onclick = () => {
      const i = document.getElementById('newTaskTmr'); const t = i.value.trim(); if(!t) return;
      const tmr = addDays(todayStr(), 1);
      const row = { id:uid(), title:t, status:'todo', category:curCat, createdDate:todayStr(),
                    currentDate:tmr, originalDate:tmr, doneTime:null, delayCount:0 };
      syncInsert('tasks', row).then(()=>{ i.value=''; i.focus(); });
    };
    const ntTmr = document.getElementById('newTaskTmr');
    if(ntTmr) ntTmr.onkeydown = e => { if(e.key==='Enter') addTmr.click(); };
    const tmrT = document.getElementById('tmrToggle');
    if(tmrT) tmrT.onclick = () => { tmrOpen = !(tmrOpen === null ? !!S.cleared[todayStr()] : tmrOpen); render(); };
    const tmrM = document.getElementById('tmrMore');
    if(tmrM) tmrM.onclick = () => { tmrAll = true; render(); };
    document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ curCat=b.dataset.cat; document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('on', x.dataset.cat===curCat)); });

    document.querySelectorAll('.task').forEach(el=>{
      const id=el.dataset.id; const task=S.tasks.find(x=>x.id===id); if(!task) return;
      el.querySelector('[data-act=toggle]').onclick = () => openStatusPicker(task);
      const eb = el.querySelector('[data-act=edit]');
      if(eb) eb.onclick = () => {
        openSheet(`<h3>编辑这件事</h3>
          <div class="field"><label>内容</label><input id="etTitle" type="text" value="${esc(task.title)}"/></div>
          <button class="block" id="saveTaskEdit">保存</button>
          <button class="block ghost" id="cancelEdit">取消</button>`);
        document.getElementById('cancelEdit').onclick=closeSheet;
        document.getElementById('saveTaskEdit').onclick=async ()=>{
          const t=document.getElementById('etTitle').value.trim(); if(!t) return;
          task.title=t; task.updatedAt=Date.now(); task.cloudPending=true;
          await syncUpdate('tasks', task); closeSheet(); render();
        };
      };
      const rb = el.querySelector('[data-act=restore]');
      if(rb) rb.onclick = async () => {
        task.status='todo'; task.doneTime=null;
        delete S.cleared[todayStr()];          // 恢复后又有的忙了，撤掉「已收尾」横幅
        await syncUpdate('tasks', task); render();
      };
      el.querySelector('[data-act=del]').onclick = async () => {
        if(confirm('删除这件事？')){ await syncDelete('tasks', id); render(); }
      };
    });

    const cb = document.getElementById('clearBtn');
    if(cb) cb.onclick = clearToday;

    bindMonth(); bindYear(); bindHabit(); bindMore(); bindAsk();
    // 问问页的对话层在 #app 外，render 重建 #app 碰不到，事件在启动时绑一次。
    // 这里只处理「聊天消息卡」上的点击（撤回/重试/勾选/接受/拒绝/复制）。
    document.querySelectorAll('#chatPad [data-retry]').forEach(b => b.onclick = () => aiRetry(b.dataset.retry));
    document.querySelectorAll('#chatPad [data-copy]').forEach(b => b.onclick = () => {
      const m = chat.find(x => x.id === b.dataset.copy); if(m) navigator.clipboard?.writeText(m.text);
    });
    document.querySelectorAll('#chatPad [data-tick]').forEach(b => b.onclick = () => {
      const [mid, i] = b.dataset.tick.split(':');
      const m = chat.find(x => x.id === mid);
      if(m && m.prop && m.prop.items[i]){ m.prop.items[i]._off = !(m.prop.items[i]._off); b.querySelector('[data-tk]').classList.toggle('on', !m.prop.items[i]._off); }
    });
    document.querySelectorAll('#chatPad [data-accept]').forEach(b => b.onclick = () => aiAccept(b.dataset.accept));
    document.querySelectorAll('#chatPad [data-reject]').forEach(b => b.onclick = () => aiReject(b.dataset.reject));
    document.querySelectorAll('#chatPad [data-undo]').forEach(b => b.onclick = () => aiUndo(b.dataset.undo));
    document.querySelectorAll('#chatPad [data-sug]').forEach(b => b.onclick = () => aiSend(b.dataset.sug));
    const op = document.getElementById('openPersona'); if(op) op.onclick = () => aiPersonaSheet();
  }

  /* ============ 四状态：统一的状态变更入口 ============ */
  const STATUS_OPTS = [
    { k:'todo',    mark:'',  label:'待完成', desc:'留在今天要做的事里' },
    { k:'done',    mark:'✓', label:'已完成', desc:'标记为做完了' },
    { k:'delayed', mark:'›', label:'已延期', desc:'往后挪一天再处理' },
    { k:'skipped', mark:'–', label:'已偷懒', desc:'今天先不做了，可以再恢复' },
  ];
  // 所有状态变化都走这里，副作用集中在同一个人地方
  function applyStatus(task, k){
    const t = todayStr();
    if(k==='done'){
      task.status = 'done'; task.doneTime = Date.now();
    } else if(k==='todo'){
      task.status = 'todo'; task.doneTime = null;
    } else if(k==='delayed'){
      task.currentDate = addDays(task.currentDate || t, 1);   // 从任务当前所在那天往后挪
      task.delayCount = (task.delayCount || 0) + 1;
      task.status = 'delayed';
    } else if(k==='skipped'){
      task.status = 'skipped';
    }
    task.updatedAt = Date.now();
    task.cloudPending = true;
  }

  // 点左侧圆圈 → 四选一
  function openStatusPicker(task){
    const cur = task.status || 'todo';
    openSheet(`<h3>选择状态</h3>
      <div class="card" style="margin-bottom:12px">${esc(task.title)}</div>
      ${STATUS_OPTS.map(o=>`
        <button class="block ${o.k===cur?'':'soft'}" style="text-align:left;margin-bottom:8px" data-st="${o.k}">
          <span style="display:inline-block;width:14px">${o.mark}</span>${o.label}${o.k===cur?' · 当前':''}
          <span class="muted" style="font-size:12px;font-weight:400;display:block;margin-top:2px">${o.desc}</span>
        </button>`).join('')}
      <button class="block ghost" id="cancelPick">取消</button>`);
    document.getElementById('cancelPick').onclick = closeSheet;
    document.querySelectorAll('#sheet [data-st]').forEach(b=>{
      b.onclick = async () => {
        const k = b.dataset.st;
        closeSheet();
        if(k !== cur){ applyStatus(task, k); await syncUpdate('tasks', task); }
        render();
      };
    });
  }

  /* ---- Clear 今日 ---- */
  function clearToday(){
    const t=todayStr();
    // 待办 + 之前延期过来的，都算「今天还没交代的」
    // （原来只筛 todo，导致延期一次的任务第二天再也进不了收尾，永远卡在延期区）
    const pending = S.tasks.filter(x=>x.currentDate===t && (x.status==='todo' || x.status==='delayed'));
    if(!pending.length){ S.cleared[t]=true; save(); render(); toast('今天已经空空如也 ✓'); return; }
    let html = `<h3>收尾今天</h3>
      <div class="muted" style="margin-bottom:10px">还有 ${pending.length} 件没交代，选一下每件以什么状态结尾：</div>
      <div class="card">
        <div class="muted" style="font-size:12px;margin-bottom:8px">或者，全部标记为</div>
        <div class="opt">
          <button class="sm grow" data-all="done">完成</button>
          <button class="sm ghost grow" data-all="delayed">延后</button>
          <button class="sm ghost grow" data-all="skipped">偷懒</button>
        </div>
      </div>`;
    pending.forEach(x=>{
      const tag = x.status==='delayed' ? `<span class="muted" style="font-size:12px"> · 已延期 ${x.delayCount} 次</span>` : '';
      html += `<div class="card">
        <div style="margin-bottom:8px">${esc(x.title)}${tag}</div>
        <div class="opt">
          <button class="soft grow" data-act="done" data-id="${x.id}">完成</button>
          <button class="ghost grow" data-act="delayed" data-id="${x.id}">延后一天</button>
          <button class="ghost grow" data-act="skipped" data-id="${x.id}">偷懒</button>
        </div>
      </div>`;
    });
    html += `<button class="block ghost" id="closeSheet">先这样，收尾</button>`;
    openSheet(html);
    document.getElementById('closeSheet').onclick = () => { S.cleared[t]=true; save(); closeSheet(); render(); toast('今天收尾完成 ✓'); };

    // 单条：选一个结尾状态
    document.querySelectorAll('#sheet [data-act]').forEach(b=>{
      b.onclick = async () => {
        const task = S.tasks.find(x=>x.id===b.dataset.id); if(!task) return;
        applyStatus(task, b.dataset.act);
        await syncUpdate('tasks', task); closeSheet(); render();
        // 用和 pending 一样的口径判断，否则还剩延期的事也会误报「收尾完成」
        const still = S.tasks.filter(x=>x.currentDate===todayStr() && (x.status==='todo'||x.status==='delayed'));
        if(still.length===0){ S.cleared[t]=true; save(); }
        render();
      };
    });

    // 批量：剩下的全部标记成同一个状态，只 flush 一次
    document.querySelectorAll('#sheet [data-all]').forEach(b=>{
      b.onclick = async () => {
        const k = b.dataset.all;
        pending.forEach(x=>applyStatus(x, k));
        S.cleared[t] = true;
        save();
        await flushPending();
        closeSheet(); render(); toast('已全部标记 ✓');
      };
    });
  }

  /* ============ 月 ============ */
  function viewMonth(){
    const m = todayStr().slice(0,7);
    const y = +m.slice(0,4), mo = +m.slice(5,7);
    // 即将到来的特别日子（7 天内，含今天）
    const upcoming = S.specialDates.filter(sd=>{ const du=daysUntil(sd.date); return du>=0 && du<=7; }).sort((a,b)=>daysUntil(a.date)-daysUntil(b.date));
    let upH = '';
    if(upcoming.length){
      upH = `<div class="card warm-card">`;
      upcoming.forEach(sd=>{ const du=daysUntil(sd.date); upH += `<div class="row" style="gap:8px;margin:4px 0"><span class="sd-dot"></span><div class="grow"><div>${esc(sd.title)}</div><div class="muted" style="font-size:12px">${du===0?'就是今天 🎉':'还有 '+du+' 天'}</div></div></div>`; });
      upH += `</div>`;
    }
    // 日历网格
    const first = new Date(y, mo-1, 1).getDay();
    const days = new Date(y, mo, 0).getDate();
    const sdSet = new Set(S.specialDates.map(sd=>sd.date));
    const taskMap = {};
    S.tasks.forEach(t=>{ if(t.currentDate && t.currentDate.startsWith(m)) taskMap[t.currentDate]=(taskMap[t.currentDate]||0)+1; });
    const wk = ['日','一','二','三','四','五','六'];
    let cells = wk.map(w=>`<div class="grid-h">${w}</div>`).join('');
    for(let i=0;i<first;i++) cells += `<div class="grid-c empty"></div>`;
    const tStr = todayStr();
    for(let d=1; d<=days; d++){
      const ds = `${m}-${String(d).padStart(2,'0')}`;
      const isT = ds===tStr, isSd = sdSet.has(ds), tn = taskMap[ds]||0;
      cells += `<div class="grid-c${isT?' today':''}">${d}${isSd?`<span class="sd-dot"></span>`:''}${tn?`<span class="task-dot">${tn}</span>`:''}</div>`;
    }
    const grid = `<div class="cal-grid">${cells}</div>`;

    const items = S.monthGoals.filter(x=>x.month===m);
    const yearOpts = `<option value="">（不挂在年计划下）</option>` + S.yearGoals.filter(yy=>yy.year===m.slice(0,4)).map(yy=>`<option value="${yy.id}">${esc(yy.title)}</option>`).join('');
    let h = `<div class="section-title">本月概览</div>`;
    h += upH;
    h += grid;
    h += `<div class="section-title">本月目标</div>`;
    if(items.length) items.forEach(x=>h+=`<div class="card row"><div class="grow">${esc(x.title)}</div><button class="iconbtn" data-editmonth="${x.id}" aria-label="编辑"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><button class="iconbtn" data-delmonth="${x.id}" aria-label="删除"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>`);
    else h+=`<div class="empty">这个月还没定目标。</div>`;
    h += `<div class="card">
      <div class="section-title" style="margin:0 0 8px">加一个本月目标</div>
      <input id="mTitle" type="text" placeholder="例如：把阳台收拾出来" style="margin-bottom:8px"/>
      <select id="mYear">${yearOpts}</select>
      <button class="block" style="margin-top:10px" id="addMonth">添加</button>
    </div>`;
    return h;

  /* ============ 习惯 ============ */
  function streak(arg){
    const dates = Array.isArray(arg) ? arg : (arg.doneDates||[]);
    const frozen = Array.isArray(arg) ? [] : (arg.frozenDates||[]);
    const set = new Set([...dates, ...frozen]);
    let s=0; let d=new Date(todayStr()+'T00:00:00');
    if(!set.has(todayStr())) d.setDate(d.getDate()-1);
    while(set.has(fmt(d))){ s++; d.setDate(d.getDate()-1); }
    return s;
  }
  function viewHabit(){
    let h = `<div class="section-title">我的小习惯</div>`;
    if(S.habits.length) S.habits.forEach(x=>{
      const on = x.doneDates.includes(todayStr());
      h += `<div class="card row">
        <div class="grow"><div>${esc(x.name)}</div><div class="muted" style="font-size:13px">连续 ${streak(x)} 天${x.freezesLeft?` · 冻结卡 ×${x.freezesLeft}`:''}</div></div>

  /* ============ 统计（纯本机数据，零同步依赖） ============ */
  function viewStats(){
    // 某一天完成的件数 = 当天标记 done 的任务 + 当天打卡的习惯
    const dayCount = day => {
      let n = 0;
      S.tasks.forEach(t => { if(t.status==='done' && t.doneTime && fmt(new Date(t.doneTime))===day) n++; });
      S.habits.forEach(h => { if(h.doneDates && h.doneDates.includes(day)) n++; });
      return n;
    };
    const ym = todayStr().slice(0,7);
    let monthN = 0;
    S.tasks.forEach(t => { if(t.status==='done' && t.doneTime && fmt(new Date(t.doneTime)).startsWith(ym)) monthN++; });
    S.habits.forEach(h => { (h.doneDates||[]).forEach(d => { if(d.startsWith(ym)) monthN++; }); });
    let best = 0;
    S.habits.forEach(h => { const s = streak(h); if(s>best) best=s; });   // 含冻结卡保住的天数
    // 本周（周一~周日）
    const dow = (new Date(todayStr()+'T00:00:00').getDay()+6)%7;
    const monday = addDays(todayStr(), -dow);
    const wkDays = []; for(let i=0;i<7;i++) wkDays.push(addDays(monday, i));
    const wkCounts = wkDays.map(dayCount);
    const wkTotal = wkCounts.reduce((a,b)=>a+b,0);
    const wkMax = Math.max(1, ...wkCounts);
    const WD = ['一','二','三','四','五','六','日'];
    // 最近 30 天热力图（最早→最近）
    const cells = []; let total30 = 0;
    for(let i=29;i>=0;i--){
      const day = addDays(todayStr(), -i);
      const n = dayCount(day); total30 += n;
      const lv = n===0 ? 0 : n===1 ? 1 : n<=3 ? 2 : n<=5 ? 3 : 4;
      cells.push(`<div class="cell ${lv?'l'+lv:''}" title="${day} · ${n} 件"></div>`);
    }
    let h = '';
    h += `<div class="section-title">最近 30 天</div>`;
    if(total30===0) h += `<div class="empty">这 30 天还没有完成记录，从今天开始吧。</div>`;
    else h += `<div class="card"><div class="heatmap">${cells.join('')}</div>
        <div class="muted" style="font-size:12px;margin-top:10px;display:flex;justify-content:flex-end;gap:6px;align-items:center">少 <span class="cell l1" style="width:12px;height:12px;display:inline-block;border-radius:3px"></span><span class="cell l4" style="width:12px;height:12px;display:inline-block;border-radius:3px"></span> 多</div></div>`;
    h += `<div class="section-title">本周趋势</div>`;
    h += `<div class="card"><div class="trend">${wkDays.map((d,i)=>{
      const n=wkCounts[i]; const pct=Math.round(n/wkMax*100);
      return `<div class="col"><div class="val">${n||''}</div><div class="track"><div class="bar ${n?'':'zero'}" style="height:${pct}%"></div></div><div class="lab">${WD[i]}</div></div>`;
    }).join('')}</div></div>`;
    h += `<div class="section-title">小结</div>`;
    h += `<div class="stat-summary">
      <div class="c"><div class="n">${wkTotal}</div><div class="t">本周完成</div></div>
      <div class="c"><div class="n">${monthN}</div><div class="t">本月完成</div></div>
      <div class="c"><div class="n">${best}</div><div class="t">最长连续打卡</div></div>
    </div>`;
    // 成就徽章：全部从本机数据实时算，不额外存状态
    const doneTotal = S.tasks.filter(t=>t.status==='done').length;
    const clearedDays = Object.keys(S.cleared||{}).length;
    const bd = [
      { n:'第一步',   i:'🌱', cur:Math.min(doneTotal,1),   goal:1,   d:'完成第一件事' },
      { n:'小有成就', i:'🌿', cur:Math.min(doneTotal,10),  goal:10,  d:'累计完成 10 件' },
      { n:'百件斩',   i:'🌳', cur:Math.min(doneTotal,100), goal:100, d:'累计完成 100 件' },
      { n:'坚持一周', i:'🔥', cur:Math.min(best,7),       goal:7,   d:'任一习惯连续 7 天' },
      { n:'习惯养成', i:'🏆', cur:Math.min(best,30),      goal:30,  d:'任一习惯连续 30 天' },

  function daysUntil(dateStr){
    const t=new Date(todayStr()+'T00:00:00');
    let next=new Date(t.getFullYear(), parseInt(dateStr.slice(5,7))-1, parseInt(dateStr.slice(8,10)));
    if(next < t) next=new Date(t.getFullYear()+1, next.getMonth(), next.getDate());
    return Math.round((next - t)/86400000);
  }
