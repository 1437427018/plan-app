<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>小计划</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="小计划" />
  <link rel="apple-touch-icon" href="icon-180.png" />

  <!-- Supabase JS（公开 CDN，仅用 anon key，无法越权） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1ea;
      --card: #fffdfa;
      --ink: #2c2722;
      --ink-soft: #8a8076;
      --line: #ece4d8;
      --accent: #c2774f;
      --accent-soft: #f3e3d8;
      --done: #6f9c7a;
      --delay: #d39a4e;
      --skip: #b6a89a;
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--ink);
      font-size: 16px; line-height: 1.5;
      padding-bottom: calc(64px + var(--safe-bottom));
    }
    .topbar {
      padding: calc(var(--safe-top) + 16px) 20px 12px;
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .topbar h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .5px; }
    .topbar .right { display: flex; align-items: center; gap: 8px; }
    .topbar .date { font-size: 13px; color: var(--ink-soft); }
    .wrap { padding: 0 16px; }
    .section-title {
      font-size: 13px; color: var(--ink-soft); font-weight: 600;
      margin: 22px 4px 10px; letter-spacing: 1px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px 16px; margin: 10px 0;
      box-shadow: 0 1px 2px rgba(60,40,20,.03);
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--ink-soft); font-size: 13px; }
    .tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; padding: 2px 9px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-weight: 600;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.todo { background: var(--ink-soft); }
    .dot.done { background: var(--done); }
    .dot.delayed { background: var(--delay); }
    .dot.skipped { background: var(--skip); }

    input[type=text], input[type=email], input[type=password], input[type=date], textarea, select {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 13px; font: inherit; color: var(--ink);
      background: #fff; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 64px; }
    button {
      font: inherit; cursor: pointer; border: 0; border-radius: 12px;
      padding: 11px 16px; background: var(--accent); color: #fff; font-weight: 600;
      transition: opacity .15s;
    }
    button:active { opacity: .75; }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    button.soft { background: var(--accent-soft); color: var(--accent); }
    button.block { width: 100%; }
    button.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
    .iconbtn {
      background: transparent; color: var(--ink-soft); padding: 6px;
      width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px;
    }
    .iconbtn:active { background: var(--line); }

    .task { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
    .task:last-child { border-bottom: 0; }
    .check {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line);
      flex: 0 0 auto; display: grid; place-items: center; background: #fff; color: #fff;
    }
    .check.on { background: var(--done); border-color: var(--done); }
    .task.delayed .check { border-color: var(--delay); }
    .check .st { font-size: 12px; font-weight: 600; line-height: 1; }
    /* 非完成状态的记号要用状态色，否则白底白字看不见 */
    .task.delayed .check .st { color: var(--delay); }
    .task.skipped .check .st { color: var(--skip); }
    .task.done .label { text-decoration: line-through; color: var(--ink-soft); }
    .task.skipped .label { text-decoration: line-through; color: var(--skip); }
    .task.skipped .check { border-color: var(--skip); }
    .task .label { flex: 1; min-width: 0; word-break: break-word; }
    .small-actions { display: flex; gap: 6px; }

    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: rgba(255,253,250,.92); backdrop-filter: saturate(1.4) blur(12px);
      border-top: 1px solid var(--line);
      display: flex; padding: 6px 4px calc(6px + var(--safe-bottom));
    }
    .tab {
      flex: 1; background: transparent; border: 0; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 0; color: var(--ink-soft); font-size: 11px; font-weight: 600;
    }
    .tab.active { color: var(--accent); }
    .tab svg { width: 22px; height: 22px; }

    .mask {
      position: fixed; inset: 0; background: rgba(40,30,20,.4);
      display: none; align-items: flex-end; z-index: 50;
    }
    .mask.show { display: flex; }
    .sheet {
      background: var(--card); width: 100%; border-radius: 20px 20px 0 0;
      padding: 18px 18px calc(18px + var(--safe-bottom));
      max-height: 84vh; overflow: auto;
    }
    .sheet h3 { margin: 0 0 14px; font-size: 17px; }
    .sheet .opt { display: flex; gap: 10px; margin: 8px 0; }
    .empty { text-align: center; color: var(--ink-soft); padding: 30px 10px; font-size: 14px; }

    #toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
      background: rgba(44,39,34,.92); color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 120;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .cleared-banner {
      background: var(--accent-soft); color: var(--accent); border-radius: 12px;
      padding: 10px 14px; font-size: 14px; font-weight: 600; text-align: center; margin: 4px 0 12px;
    }
    .cloud-badge { font-size: 12px; color: var(--done); font-weight: 600; }
    .cloud-note { font-size: 12px; color: var(--ink-soft); margin: -4px 4px 8px; }
    .codebox {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
      background: #faf6f0; border: 1px dashed var(--line); border-radius: 10px;
      padding: 10px; word-break: break-all; color: var(--ink);
    }

    /* ---------- 登录 / 注册首屏 ---------- */
    #auth {
      position: fixed; inset: 0; z-index: 100; background: var(--bg);
      display: flex; flex-direction: column; overflow: auto;
      padding: calc(var(--safe-top) + 44px) 22px calc(28px + var(--safe-bottom));
    }
    #auth.hide { display: none; }
    .auth-brand { text-align: center; margin-bottom: 24px; }
    .auth-logo {
      width: 62px; height: 62px; border-radius: 20px; margin: 0 auto 14px;
      background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
    }
    .auth-logo svg { width: 30px; height: 30px; }
    .auth-brand h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: 2px; }
    .auth-brand p { margin: 0; color: var(--ink-soft); font-size: 13px; }
    .auth-tabs {
      display: flex; gap: 4px; background: var(--accent-soft);
      border-radius: 12px; padding: 4px; margin-bottom: 16px;
    }
    .auth-tabs button { flex: 1; background: transparent; color: var(--accent); font-size: 14px; padding: 9px 0; border-radius: 9px; }
    .auth-tabs button.on { background: #fff; box-shadow: 0 1px 2px rgba(60,40,20,.07); }
    .auth-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--ink-soft); margin: 0 0 6px 2px; }
    .auth-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
    .cb { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; margin: 0; }
    .cb input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
    .auth-err { color: #b4483c; font-size: 13px; min-height: 18px; text-align: center; margin: 0 0 8px; }
    .auth-foot { margin-top: 16px; text-align: center; }
    .linkbtn { background: transparent; color: var(--ink-soft); font-size: 13px; padding: 6px; text-decoration: underline; font-weight: 500; }
    .auth-tip { margin-top: 14px; font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.7; }
    #auSubmit[disabled] { opacity: .6; }
  </style>
</head>
<body>
  <!-- 首屏：登录 / 注册 -->
  <div id="auth">
    <div class="auth-brand">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>
          <path d="M8.5 14.5l2 2 4-4"/>
        </svg>
      </div>
      <h1>小计划</h1>
      <p>两个人，把日子一件件过完</p>
    </div>

    <div class="auth-tabs">
      <button id="tabLogin" class="on">登录</button>
      <button id="tabSignup">注册</button>
    </div>

    <div class="auth-card">
      <div class="field">
        <label>邮箱</label>
        <input id="auEmail" type="email" placeholder="you@example.com" autocapitalize="off" autocorrect="off" autocomplete="email"/>
      </div>
      <div class="field" id="fName" style="display:none">
        <label>昵称（选填）</label>
        <input id="auName" type="text" placeholder="ta 看到的名字" autocomplete="nickname"/>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="auPass" type="password" placeholder="至少 6 位" autocomplete="current-password"/>
      </div>
      <div class="field" id="fPass2" style="display:none">
        <label>确认密码</label>
        <input id="auPass2" type="password" placeholder="再输一次" autocomplete="new-password"/>
      </div>
      <div class="auth-row">
        <label class="cb"><input type="checkbox" id="auAuto" checked/>自动登录</label>
        <span class="muted" style="font-size:12px">下次打开直接进入</span>
      </div>
      <div class="auth-err" id="auErr"></div>
      <button class="block" id="auSubmit">登录</button>
    </div>

    <div class="auth-foot">
      <button class="linkbtn" id="auGuest">先随便看看（数据只存本机）</button>
    </div>
    <div class="auth-tip">注册后自动登录。两人各注册一个账号，<br/>在「更多 → 已登录」里配对，就能共享了。</div>
  </div>

  <div class="topbar">
    <h1 id="viewTitle">今日</h1>
    <div class="right">
      <span class="date" id="todayLabel"></span>
      <button class="soft sm" id="accountBtn">登录</button>
    </div>
  </div>

  <div class="wrap" id="app"></div>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
  <div id="toast"></div>

  <script>
  /* ============ 存储（本机个人数据，兼作云端缓存） ============ */
  const KEY = 'planapp_v1';
  const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const addDays = (s,n) => { const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return fmt(d); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function defaultState(){
    return { yearGoals:[], monthGoals:[], tasks:[], habits:[], specialDates:[],
             pendingDeletes:[],   // 待从云端删除的记录
             ownerId: null,       // 这批本机数据属于哪个账号（换账号时用来判断要不要清空）
             warmMessage:{text:'',updatedAt:null},
             whispers:[], sharedList:[], cleared:{} };
  }
  const loadLocal = () => { try { return Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY))||{}); } catch(e){ return defaultState(); } };
  let S = loadLocal();
  let save = () => localStorage.setItem(KEY, JSON.stringify(S));

  /* ============ 换账号时的数据归属 ============ */
  // 退出登录原来不清 S，导致下一个账号登录后，上一个人的数据被当成「本机数据」上传，
  // 直接污染新账号。这里记住数据属于谁，换人就清空。
  // 首次登录（ownerId 为空）不清 —— 那是离线模式下攒的数据，应该归给这个账号。
  function adoptLocalData(uid){
    if(S.ownerId && S.ownerId !== uid) S = defaultState();
    S.ownerId = uid;
    save();
  }

  /* ============ 用户设置（warmMessage + cleared 同步） ============ */
  async function loadUserSettings(){
    if(!cloudMode() || !sb || !me) return;
    try {
      const { data } = await sb.from('user_settings').select('warm_message, cleared').eq('user_id', me.id).single();
      if(!data) return;
      if(data.warm_message && (data.warm_message.text || S.warmMessage?.updatedAt)){
        S.warmMessage = data.warm_message;
      }
      if(data.cleared && typeof data.cleared === 'object'){
        S.cleared = data.cleared;
      }
    } catch(e){ console.warn('加载 user_settings 失败', e); }
  }
  async function saveUserSettings(){
    if(!cloudMode() || !sb || !me) return;
    try {
      await sb.from('user_settings').upsert({
        user_id: me.id,
        warm_message: { text: S.warmMessage.text || '', updatedAt: S.warmMessage.updatedAt || null },
        cleared: S.cleared || {},
      }, { onConflict: 'user_id' });
    } catch(e){ console.warn('保存 user_settings 失败', e); }
  }
  // save() 也触发云端设置同步（warmMessage/cleared 很少变，无性能问题）
  const _origSave = save;
  save = () => { _origSave(); if(cloudMode()){ saveUserSettings(); } };

  /* ============ Supabase（公开 anon key，仅用于前端登录与两人共享） ============ */
  const SB_URL = 'https://hoofhoblsbnivtbxqduq.supabase.co';
  const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhvb2Zob2Jsc2JuaXZ0YnhxZHVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4ODMyNDMsImV4cCI6MjEwMzQ1OTI0M30.oYEYi3l6KTvkTXLO7kevdCX2UiDLKlGkAy5PIWYgqk4';
  let sb = null, me = null, myRel = null, partnerId = null;
  let cloudWhispers = [], cloudList = null, cloudReady = false, rtSelf = null, rtRel = null;

  const cloudMode = () => !!(sb && me);

  async function initSB(){
    if(!window.supabase){ showAuth('离线中：登录后才能同步'); return; }   // 脚本没加载，停在登录页
    try {
      if(!sb) sb = window.supabase.createClient(SB_URL, SB_ANON, { auth: { persistSession: true, autoRefreshToken: true } });

      // 关掉「自动登录」：不保留上次的会话，每次打开都必须重新登录
      if(!authPref().autoLogin) await sb.auth.signOut();

      const { data } = await sb.auth.getUser();
      if(data.user){ me = data.user; guest = false; hideAuth(); adoptLocalData(me.id); await loadUserSettings(); await loadRelationship(); }
      else showAuth();

      sb.auth.onAuthStateChange(async (e, session) => {
      me = session?.user || null;
      if(me){ guest = false; hideAuth(); adoptLocalData(me.id); await loadUserSettings(); await loadRelationship(); }
        else {
          myRel = null; partnerId = null; cloudReady = false; stopRealtime();
          if(!guest) showAuth();          // 退出登录 → 回到登录页
        }
        render();
      });
    } catch(err){
      console.warn('Supabase 初始化失败，使用本机模式', err);
      showAuth('连不上服务器，检查一下网络');
    }
  }

  async function loadRelationship(){
    if(!sb || !me) return;
    startRealtimeSelf();          // 不管有没有配对，先订阅自己的数据
    const { data } = await sb.from('relationships').select('*').or(`user_a.eq.${me.id},user_b.eq.${me.id}`).limit(1);
    if(data && data[0]){
      myRel = data[0];
      partnerId = (myRel.user_a === me.id) ? myRel.user_b : myRel.user_a;
      cloudReady = true;
      startRealtimeRel();
      await refreshCloud();
    } else {
      myRel = null; partnerId = null; cloudReady = false;
    }
    await runSync();     // 登录后：先补传本机改动，再拉云端合并
  }

  async function refreshCloud(){
    if(!cloudReady) return;
    const { data: w } = await sb.from('whispers').select('*').order('created_at', { ascending: true });
    cloudWhispers = w || [];
    const { data: l } = await sb.from('shared_lists').select('*').eq('relationship_id', myRel.id).limit(1);
    cloudList = (l && l[0]) ? l[0] : null;
    if(!cloudList){
      const { data: nl } = await sb.from('shared_lists').insert({ relationship_id: myRel.id, items: [] }).select().single();
      cloudList = nl;
    }
    render();
  }

  // 自己的计划数据：登录后立刻订阅，不依赖配对 —— 多设备同步靠这条
  function startRealtimeSelf(){
    if(rtSelf || !sb || !me) return;
    rtSelf = sb.channel('self-'+me.id);
    Object.values(PLAN_TABLES).forEach(t =>
      rtSelf.on('postgres_changes', { event:'*', schema:'public', table:t }, debouncedPull));
    // 「已收尾」标记和暖心话存在 user_settings 里，也要能实时跟过来
    rtSelf.on('postgres_changes', { event:'*', schema:'public', table:'user_settings' },
      () => { loadUserSettings().then(render); });
    rtSelf.subscribe();
  }
  // 两人共享的数据：配对成功后才订阅
  function startRealtimeRel(){
    if(rtRel || !sb || !myRel) return;
    rtRel = sb.channel('rel-'+myRel.id)
      .on('postgres_changes', { event:'*', schema:'public', table:'whispers' }, refreshCloud)
      .on('postgres_changes', { event:'*', schema:'public', table:'shared_lists', filter:`relationship_id=eq.${myRel.id}` }, refreshCloud)
      .subscribe();
  }
  function stopRealtime(){
    if(rtSelf){ sb?.removeChannel(rtSelf); rtSelf = null; }
    if(rtRel){ sb?.removeChannel(rtRel); rtRel = null; }
  }

  /* ============ 云端计划数据层（年/月/日/习惯/特别日子） ============ */
  const PLAN_TABLES = { yearGoals:'year_goals', monthGoals:'month_goals', tasks:'tasks', habits:'habits', specialDates:'special_dates' };
  // 云端主键是 uuid，本机 uid() 生成的是短 id。没成功上云前拿短 id 去查 uuid 列会报
  // invalid input syntax for type uuid，所以所有云端操作前都要过这道闸
  const isUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s || '');

  // 合并的依据：updatedAt 是客户端逻辑时间（毫秒），两边比大小，谁新谁赢
  function toCloud(kind, r){
    const base = {
      user_id: me.id,                                                  // RLS 要求，必须显式带上
      updated_at: new Date(r.updatedAt || Date.now()).toISOString(),
    };
    switch(kind){
      case 'yearGoals':   return { ...base, title:r.title, description:r.desc, year:r.year };
      case 'monthGoals':  return { ...base, title:r.title, month:r.month, year_goal_id:r.yearGoalId||null };
      // done_time 是 timestamptz，必须传 ISO 字符串。直接传 Date.now() 的毫秒数字
      // Postgres 会报 22008 date/time field value out of range —— 勾完成就永远同步不上
      case 'tasks':       return { ...base, title:r.title, status:r.status, created_date:r.createdDate, plan_date:r.currentDate, original_date:r.originalDate, done_time: r.doneTime ? new Date(r.doneTime).toISOString() : null, delay_count:r.delayCount };
      case 'habits':      return { ...base, name:r.name, done_dates:r.doneDates };
      case 'specialDates':return { ...base, title:r.title, date:r.date };
    }
  }
  function fromCloud(kind, r){
    const t = r.updated_at ? new Date(r.updated_at).getTime() : 0;
    switch(kind){
      case 'yearGoals':   return { id:r.id, title:r.title, desc:r.description, year:r.year, updatedAt:t };
      case 'monthGoals':  return { id:r.id, title:r.title, month:r.month, yearGoalId:r.year_goal_id, updatedAt:t };
      case 'tasks':       return { id:r.id, title:r.title, status:r.status, createdDate:r.created_date, currentDate:r.plan_date, originalDate:r.original_date, doneTime: r.done_time ? new Date(r.done_time).getTime() : null, delayCount:r.delay_count, updatedAt:t };
      case 'habits':      return { id:r.id, name:r.name, doneDates:r.done_dates||[], updatedAt:t };
      case 'specialDates':return { id:r.id, title:r.title, date:r.date, updatedAt:t };
    }
  }
  // 本地新增：先入本机，云端模式再插入并回填云 id
  // 三个写操作统一：先落本机 + 打待传标记，再交给 flushPending 补传。
  // 断网时请求失败，标记留着不动，联网后自动重试 —— 改动不会丢。
  async function syncInsert(kind, row){
    row.updatedAt = Date.now();
    row.cloudPending = true;
    row._retryCount = 0;                          // 失败重试计数，防止死循环
    S[kind].push(row); save();
    await flushPending();
  }
  async function syncUpdate(kind, row){
    row.updatedAt = Date.now();
    row.cloudPending = true;
    row._retryCount = 0;
    save();
    await flushPending();
  }
  async function syncDelete(kind, id){
    const row = S[kind].find(x => x.id === id);
    // 只有已经上过云（uuid）的才需要去云端删；短 id 云端本来就没有，
    // 加进队列只会让 flushPending 反复拿短 id 去查 uuid 列报类型转换错
    if(row && isUuid(row.id)) S.pendingDeletes.push({ kind, id: row.id });
    S[kind] = S[kind].filter(x => x.id !== id);
    save();
    await flushPending();
  }

  /* ---------- 待同步队列 ---------- */
  let flushing = false;
  // 同步失败：网络问题静默等重试；数据/权限问题重试也没用，要明确告诉用户。
  // 关键：无论哪种都保留 cloudPending 标记，绝不静默丢弃 —— 之前「3 次后清标记」
  // 正是让 done_time 类型错误被彻底掩盖、数据悄悄不同步的原因。
  function onSyncFail(kind, r, error){
    r._retryCount = (r._retryCount || 0) + 1;
    const msg = (error && error.message) || String(error || '');
    const isNet = /Failed to fetch|NetworkError|fetch failed|network|timeout/i.test(msg);
    if(!isNet && r._retryCount === 1){
      toast('有内容没同步上去，看控制台');
      console.error('[sync] 非网络错误，重试无用：', kind, r, error);
    }
  }
  async function flushPending(){
    if(!cloudMode() || flushing) return;
    flushing = true;
    try {
      // 先把所有待传行收集为 {kind, row} 对（避免 S[kind] 被 pullPlans 替换引用）
      const pending = [];
      for(const kind of Object.keys(PLAN_TABLES)){
        for(const r of S[kind]){
          if(r.cloudPending){ pending.push({ kind, row: r }); }
        }
      }
      for(const { kind, row: r } of pending){
        if(!cloudMode()) break;                    // 中途断网，停止处理
        try {
          if(isUuid(r.id)){
            const { error } = await sb.from(PLAN_TABLES[kind]).update(toCloud(kind, r)).eq('id', r.id);
            if(error){ onSyncFail(kind, r, error); continue; }
          } else {
            const { data, error } = await sb.from(PLAN_TABLES[kind]).insert(toCloud(kind, r)).select().single();
            if(error){ onSyncFail(kind, r, error); continue; }
            r.id = data.id;
          }
          delete r.cloudPending; delete r._retryCount; save();
        } catch(e){ onSyncFail(kind, r, e); }
      }
      if(S.pendingDeletes.length && cloudMode()){
        const rest = [];
        for(const d of S.pendingDeletes){
          if(!isUuid(d.id)) continue;               // 云端没有这条，无需删除，丢弃即可
          try {
            const { error } = await sb.from(PLAN_TABLES[d.kind]).delete().eq('id', d.id);
            if(error){ console.warn('pendingDelete 失败', d, error); rest.push(d); }
          } catch(e){ console.warn('pendingDelete 异常', e); rest.push(d); }
        }
        S.pendingDeletes = rest; save();
      }
    } finally { flushing = false; }
  }

  /* ---------- 拉取与合并 ---------- */
  let syncing = false, pullT = null;
  function debouncedPull(){ clearTimeout(pullT); pullT = setTimeout(runSync, 500); }
  // 顺序要紧：先把本机改动推上去，再拉云端，否则本机刚改的会被判成过期数据
  async function runSync(){ await flushPending(); await pullPlans(); await flushPending(); }

  // 双向合并：本机有未上传改动 → 本机赢；否则比 updatedAt，谁新谁赢；云端独有的补进来
  function mergeRows(localRows, cloudRows){
    const cloudById = new Map(cloudRows.map(r => [r.id, r]));
    const out = [];
    for(const local of localRows){
      if(local.cloudPending){
        // 本机新增但还没上传：保留，不让云端旧版覆盖
        // 如果是短 id，说明还没上云，必须保留（云端的同标题是无关记录）
        if(isUuid(local.id)){
          cloudById.delete(local.id);               // 从云端里排除，避免重复
        }
        out.push(local);
        continue;
      }
      const c = cloudById.get(local.id);
      if(c) cloudById.delete(local.id);
      if(!c) continue;                              // 云端已删 → 本机跟着删
      out.push((c.updatedAt || 0) > (local.updatedAt || 0) ? c : local);
    }
    for(const c of cloudById.values()) out.push(c);  // 别的设备新增的
    return out;
  }

  async function pullPlans(){
    if(!cloudMode() || syncing) return;
    syncing = true;
    try {
      const [yg, mg, tk, hb, sd] = await Promise.all([
        sb.from('year_goals').select('*'),
        sb.from('month_goals').select('*'),
        sb.from('tasks').select('*'),
        sb.from('habits').select('*'),
        sb.from('special_dates').select('*'),
      ]);
      // 从没上过云的老数据（短 id）也标成待传，免得被当成「云端已删」给丢掉
      Object.keys(PLAN_TABLES).forEach(k => S[k].forEach(r => {
        if(!isUuid(r.id) && !r.cloudPending){ r.cloudPending = true; r.updatedAt = r.updatedAt || Date.now(); }
      }));
      Object.assign(S, {
        yearGoals:    mergeRows(S.yearGoals,    (yg.data||[]).map(r => fromCloud('yearGoals', r))),
        monthGoals:   mergeRows(S.monthGoals,   (mg.data||[]).map(r => fromCloud('monthGoals', r))),
        tasks:        mergeRows(S.tasks,        (tk.data||[]).map(r => fromCloud('tasks', r))),
        habits:       mergeRows(S.habits,       (hb.data||[]).map(r => fromCloud('habits', r))),
        specialDates: mergeRows(S.specialDates, (sd.data||[]).map(r => fromCloud('specialDates', r))),
      });
      save();
    } catch(e){ console.warn('pullPlans 失败', e); }
    finally { syncing = false; render(); }
  }

  /* ============ 工具 ============ */
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
  function openSheet(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('mask').classList.add('show'); }
  function closeSheet(){ document.getElementById('mask').classList.remove('show'); }
  document.getElementById('mask').addEventListener('click', e => { if(e.target.id==='mask') closeSheet(); });
  const v = id => (document.getElementById(id)?.value || '').trim();

  /* ============ 登录 / 注册（首屏） ============ */
  const AUTH_KEY = 'planapp_auth';
  const byId = id => document.getElementById(id);
  function authPref(){
    try { return Object.assign({ autoLogin:true, email:'' }, JSON.parse(localStorage.getItem(AUTH_KEY)) || {}); }
    catch(e){ return { autoLogin:true, email:'' }; }
  }
  function saveAuthPref(p){ try { localStorage.setItem(AUTH_KEY, JSON.stringify(Object.assign(authPref(), p))); } catch(e){} }

  let authMode = 'login', guest = false;   // guest：离线试用，不强制登录

  function setAuthErr(m){ byId('auErr').textContent = m || ''; }
  function showAuth(msg){ byId('auth').classList.remove('hide'); if(msg) setAuthErr(msg); }
  function hideAuth(){ byId('auth').classList.add('hide'); setAuthErr(''); }

  function setAuthMode(m){
    authMode = m;
    byId('tabLogin').classList.toggle('on', m === 'login');
    byId('tabSignup').classList.toggle('on', m === 'signup');
    byId('fName').style.display  = (m === 'signup') ? '' : 'none';
    byId('fPass2').style.display = (m === 'signup') ? '' : 'none';
    byId('auPass').autocomplete  = (m === 'signup') ? 'new-password' : 'current-password';
    authBusy(false);
    setAuthErr('');
  }
  function authBusy(on, text){
    const b = byId('auSubmit');
    b.disabled = !!on;
    b.textContent = on ? (text || '请稍候…') : (authMode === 'login' ? '登录' : '注册并进入');
  }

  function friendlyAuthError(e){
    const m = (e && e.message) ? e.message : String(e || '出错了');
    if(/Invalid login credentials/i.test(m))      return '邮箱或密码不对';
    if(/Email not confirmed/i.test(m))            return '邮箱还没确认，去收件箱点一下链接';
    if(/already registered|already been registered/i.test(m)) return '这个邮箱注册过了，切到「登录」吧';
    if(/Password should be at least/i.test(m))    return '密码至少 6 位';
    if(/rate limit|security purposes/i.test(m))    return '试得太频繁，稍等一会儿再来';
    if(/unable to validate email|invalid format/i.test(m)) return '邮箱格式不太对';
    if(/Failed to fetch|NetworkError|fetch/i.test(m)) return '网络连不上，检查一下网络';
    return m;
  }

  function ensureClient(){
    if(!window.supabase) return null;
    if(!sb) sb = window.supabase.createClient(SB_URL, SB_ANON, { auth: { persistSession: true, autoRefreshToken: true } });
    return sb;
  }

  async function doAuth(){
    const email = byId('auEmail').value.trim();
    const pass  = byId('auPass').value;
    setAuthErr('');
    if(!/^\S+@\S+\.\S+$/.test(email)) return setAuthErr('邮箱格式不太对');
    if(pass.length < 6)               return setAuthErr('密码至少 6 位');
    if(authMode === 'signup' && pass !== byId('auPass2').value) return setAuthErr('两次输入的密码不一致');

    if(!ensureClient()) return setAuthErr('网络不可用，可先点下面「先随便看看」');

    const auto = byId('auAuto').checked;
    saveAuthPref({ autoLogin: auto, email: auto ? email : '' });

    authBusy(true, authMode === 'login' ? '登录中…' : '注册中…');
    try {
      if(authMode === 'login'){
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if(error){ authBusy(false); return setAuthErr(friendlyAuthError(error)); }
        toast('欢迎回来');
      } else {
        const name = byId('auName').value.trim() || email.split('@')[0];
        const { data, error } = await sb.auth.signUp({
          email, password: pass,
          options: { data: { display_name: name } }
        });
        if(error){ authBusy(false); return setAuthErr(friendlyAuthError(error)); }
        if(!data.session){          // 服务端要求邮箱确认
          authBusy(false); setAuthMode('login');
          return setAuthErr('注册成功，去邮箱点确认后再登录');
        }
        // 触发器会建 profiles 行，这里兜底把昵称写准（失败也不该挡住登录）
        try { await sb.from('profiles').upsert({ id: data.user.id, display_name: name }, { onConflict: 'id' }); }
        catch(e){ console.warn('写 profiles 失败', e); }
        toast('注册成功，已登录');
      }
      guest = false;
      hideAuth();
    } catch(err){
      authBusy(false);
      setAuthErr(friendlyAuthError(err));
    }
  }

  /* ============ 账号 / 配对 ============ */
  function openAccount(){

      <button class="block ghost" id="doLogout">退出登录</button>`);
    document.getElementById('doLogout').onclick = async () => { await sb.auth.signOut(); closeSheet(); toast('已退出'); };
  }

  /* ============ 视图切换 ============ */
  const TABS = [
    { id:'today', label:'今日', icon:'<path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0Z"/><path d="M12 7v5l3 2"/>' },
    { id:'month', label:'月', icon:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>' },
    { id:'year', label:'年', icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
    { id:'habit', label:'习惯', icon:'<path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 16l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/>' },
    { id:'more', label:'更多', icon:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>' },
  ];
  let view = 'today';
  function renderTabs(){
    document.getElementById('tabbar').innerHTML = TABS.map(t =>
      `<button class="tab ${t.id===view?'active':''}" data-view="${t.id}">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>
         ${t.label}</button>`).join('');
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => { view=b.dataset.view; render(); });
  }
  const TITLES = { today:'今日', month:'本月', year:'今年', habit:'习惯', more:'更多' };
  function render(){
    document.getElementById('viewTitle').textContent = TITLES[view];
    document.getElementById('todayLabel').textContent = todayStr();
    const ab = document.getElementById('accountBtn');
    ab.textContent = me ? (cloudReady ? '已连接' : '已登录') : '登录';
    renderTabs();
    const app = document.getElementById('app');
    if(view==='today') app.innerHTML = viewToday();
    else if(view==='month') app.innerHTML = viewMonth();
    else if(view==='year') app.innerHTML = viewYear();
    else if(view==='habit') app.innerHTML = viewHabit();
    else app.innerHTML = viewMore();
    bindView();
  }

  /* ============ 今日 ============ */
  function todays(){ const t=todayStr(); return S.tasks.filter(x=>x.currentDate===t); }
  function viewToday(){
    const t=todayStr();
    const delayed = todays().filter(x=>x.status==='delayed');
    const todo = todays().filter(x=>x.status==='todo');
    const done = todays().filter(x=>x.status==='done');
    const skipped = todays().filter(x=>x.status==='skipped');
    const cleared = S.cleared[t];
    let h = '';
    if(cleared) h += `<div class="cleared-banner">今天已经收尾啦 · 明天见 ☀</div>`;

    h += `<div class="section-title">延期 · 从之前挪来</div>`;
    if(delayed.length) delayed.forEach(x=>h+=taskRow(x,true)); else h+=`<div class="empty">没有延期的事，轻松。</div>`;

    h += `<div class="section-title">今日待办</div>`;
    if(todo.length) todo.forEach(x=>h+=taskRow(x,false)); else h+=`<div class="empty">还没有安排，加一件小事吧。</div>`;

    h += `<div class="card"><div class="row"><input id="newTask" type="text" placeholder="加一件今天要做的事…" /><button class="sm" id="addTask">加</button></div></div>`;

    if(done.length){
      h += `<div class="section-title">已完成</div>`;
      done.forEach(x=>h+=taskRow(x,false));
    }
    if(skipped.length){
      h += `<div class="section-title">今天偷的懒</div>`;
      skipped.forEach(x=>h+=taskRow(x,false));
    }
    h += `<div class="card"><button class="block soft" id="clearBtn">收尾今天</button></div>`;
    h += `<div class="muted" style="text-align:center;margin-top:6px">点左侧圆圈可以随时改状态；收尾时再给剩下的选个结尾。</div>`;
    return h;
  }
  function taskRow(x, isDelayed){
    const st = x.status;
    const cls = st==='done' ? 'done' : (st==='skipped' ? 'skipped' : (isDelayed ? 'delayed' : ''));
    const sub = isDelayed ? `<div class="muted" style="font-size:12px">原 ${x.originalDate} · 已延期 ${x.delayCount} 次</div>` : '';
    // 偷懒的给个「恢复」入口，可以反悔把它放回待办
    const restore = st==='skipped'
      ? `<button class="iconbtn" data-act="restore" aria-label="恢复">
           <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>
         </button>`
      : '';
    // 圆圈里的记号：完成=勾，延期=右尖角（往后挪），偷懒=横线
    const stMark = st==='done' ? '✓' : (st==='delayed' ? '›' : (st==='skipped' ? '–' : ''));
    return `<div class="task ${cls}" data-id="${x.id}">
      <div class="check ${st==='done'?'on':''}" data-act="toggle"><span class="st">${stMark}</span></div>
      <div class="label grow">${esc(x.title)}${sub}</div>
      <div class="small-actions">${restore}
        <button class="iconbtn" data-act="del" aria-label="删除">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
        </button>
      </div>
    </div>`;
  }
  function bindView(){
    const addT = document.getElementById('addTask');
    if(addT) addT.onclick = () => { const i=document.getElementById('newTask'); const t=i.value.trim(); if(!t) return; const row={id:uid(),title:t,status:'todo',createdDate:todayStr(),currentDate:todayStr(),originalDate:todayStr(),doneTime:null,delayCount:0}; syncInsert('tasks', row).then(render); };
    const nt = document.getElementById('newTask');
    if(nt) nt.onkeydown = e => { if(e.key==='Enter') addT.click(); };

    document.querySelectorAll('.task').forEach(el=>{
      const id=el.dataset.id; const task=S.tasks.find(x=>x.id===id); if(!task) return;
      el.querySelector('[data-act=toggle]').onclick = () => openStatusPicker(task);
      const rb = el.querySelector('[data-act=restore]');
      if(rb) rb.onclick = async () => {
        task.status='todo'; task.doneTime=null;
        delete S.cleared[todayStr()];          // 恢复后又有的忙了，撤掉「已收尾」横幅
        await syncUpdate('tasks', task); render();
      };
      el.querySelector('[data-act=del]').onclick = async () => {
        if(confirm('删除这件事？')){ await syncDelete('tasks', id); render(); }
      };
    });

    const cb = document.getElementById('clearBtn');
    if(cb) cb.onclick = clearToday;

    bindMonth(); bindYear(); bindHabit(); bindMore();
  }

  /* ============ 四状态：统一的状态变更入口 ============ */
  const STATUS_OPTS = [
    { k:'todo',    mark:'',  label:'待完成', desc:'留在今天要做的事里' },
    { k:'done',    mark:'✓', label:'已完成', desc:'标记为做完了' },
    { k:'delayed', mark:'›', label:'已延期', desc:'往后挪一天再处理' },
    { k:'skipped', mark:'–', label:'已偷懒', desc:'今天先不做了，可以再恢复' },
  ];
  // 所有状态变化都走这里，副作用集中在同一个人地方
  function applyStatus(task, k){
    const t = todayStr();
    if(k==='done'){
      task.status = 'done'; task.doneTime = Date.now();
    } else if(k==='todo'){
      task.status = 'todo'; task.doneTime = null;
    } else if(k==='delayed'){
      task.currentDate = addDays(task.currentDate || t, 1);   // 从任务当前所在那天往后挪
      task.delayCount = (task.delayCount || 0) + 1;
      task.status = 'delayed';
    } else if(k==='skipped'){
      task.status = 'skipped';
    }
    task.updatedAt = Date.now();
    task.cloudPending = true;
  }

  // 点左侧圆圈 → 四选一
  function openStatusPicker(task){
    const cur = task.status || 'todo';
    openSheet(`<h3>选择状态</h3>
      <div class="card" style="margin-bottom:12px">${esc(task.title)}</div>
      ${STATUS_OPTS.map(o=>`
        <button class="block ${o.k===cur?'':'soft'}" style="text-align:left;margin-bottom:8px" data-st="${o.k}">
          <span style="display:inline-block;width:14px">${o.mark}</span>${o.label}${o.k===cur?' · 当前':''}
          <span class="muted" style="font-size:12px;font-weight:400;display:block;margin-top:2px">${o.desc}</span>
        </button>`).join('')}
      <button class="block ghost" id="cancelPick">取消</button>`);
    document.getElementById('cancelPick').onclick = closeSheet;
    document.querySelectorAll('#sheet [data-st]').forEach(b=>{
      b.onclick = async () => {
        const k = b.dataset.st;
        closeSheet();
        if(k !== cur){ applyStatus(task, k); await syncUpdate('tasks', task); }
        render();
      };
    });
  }

  /* ---- Clear 今日 ---- */
  function clearToday(){
    const t=todayStr();
    // 待办 + 之前延期过来的，都算「今天还没交代的」
    // （原来只筛 todo，导致延期一次的任务第二天再也进不了收尾，永远卡在延期区）
    const pending = S.tasks.filter(x=>x.currentDate===t && (x.status==='todo' || x.status==='delayed'));
    if(!pending.length){ S.cleared[t]=true; save(); render(); toast('今天已经空空如也 ✓'); return; }
    let html = `<h3>收尾今天</h3>
      <div class="muted" style="margin-bottom:10px">还有 ${pending.length} 件没交代，选一下每件以什么状态结尾：</div>
      <div class="card">
        <div class="muted" style="font-size:12px;margin-bottom:8px">或者，全部标记为</div>
        <div class="opt">
          <button class="sm grow" data-all="done">完成</button>
          <button class="sm ghost grow" data-all="delayed">延后</button>
          <button class="sm grow" style="background:transparent;color:var(--ink-soft);border:1px solid var(--line)" data-all="skipped">偷懒</button>
        </div>
      </div>`;
    pending.forEach(x=>{
      const tag = x.status==='delayed' ? `<span class="muted" style="font-size:12px"> · 已延期 ${x.delayCount} 次</span>` : '';
      html += `<div class="card">
        <div style="margin-bottom:8px">${esc(x.title)}${tag}</div>
        <div class="opt">
          <button class="soft grow" data-act="done" data-id="${x.id}">完成</button>
          <button class="ghost grow" data-act="delayed" data-id="${x.id}">延后一天</button>
          <button class="sm grow" style="background:transparent;color:var(--ink-soft);border:1px solid var(--line)" data-act="skipped" data-id="${x.id}">偷懒</button>
        </div>
      </div>`;
    });
    html += `<button class="block ghost" id="closeSheet">先这样，收尾</button>`;
    openSheet(html);
    document.getElementById('closeSheet').onclick = () => { S.cleared[t]=true; save(); closeSheet(); render(); toast('今天收尾完成 ✓'); };

    // 单条：选一个结尾状态
    document.querySelectorAll('#sheet [data-act]').forEach(b=>{
      b.onclick = async () => {
        const task = S.tasks.find(x=>x.id===b.dataset.id); if(!task) return;
        applyStatus(task, b.dataset.act);
        await syncUpdate('tasks', task); closeSheet(); render();
        // 用和 pending 一样的口径判断，否则还剩延期的事也会误报「收尾完成」
        const still = S.tasks.filter(x=>x.currentDate===todayStr() && (x.status==='todo'||x.status==='delayed'));
        if(still.length===0){ S.cleared[t]=true; save(); }
        render();
      };
    });

    // 批量：剩下的全部标记成同一个状态，只 flush 一次
    document.querySelectorAll('#sheet [data-all]').forEach(b=>{
      b.onclick = async () => {
        const k = b.dataset.all;
        pending.forEach(x=>applyStatus(x, k));
        S.cleared[t] = true;
        save();
        await flushPending();
        closeSheet(); render(); toast('已全部标记 ✓');
      };
    });
  }

  /* ============ 月 ============ */
  function viewMonth(){
    const m = todayStr().slice(0,7);
    const items = S.monthGoals.filter(x=>x.month===m);
    const yearOpts = `<option value="">（不挂在年计划下）</option>` + S.yearGoals.filter(y=>y.year===m.slice(0,4)).map(y=>`<option value="${y.id}">${esc(y.title)}</option>`).join('');
    let h = `<div class="section-title">本月目标</div>`;
    if(items.length) items.forEach(x=>h+=`<div class="card row"><div class="grow">${esc(x.title)}</div><button class="iconbtn" data-delmonth="${x.id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>`);
    else h+=`<div class="empty">这个月还没定目标。</div>`;
    h += `<div class="card">
      <div class="section-title" style="margin:0 0 8px">加一个本月目标</div>
      <input id="mTitle" type="text" placeholder="例如：把阳台收拾出来" style="margin-bottom:8px"/>
      <select id="mYear">${yearOpts}</select>
      <button class="block" style="margin-top:10px" id="addMonth">添加</button>
    </div>`;
    return h;
  }
  function bindMonth(){
    const a=document.getElementById('addMonth'); if(!a) return;
    a.onclick=()=>{ const t=document.getElementById('mTitle').value.trim(); if(!t) return; const row={id:uid(),title:t,month:todayStr().slice(0,7),yearGoalId:document.getElementById('mYear').value||null,done:false}; syncInsert('monthGoals', row).then(render); };
    document.querySelectorAll('[data-delmonth]').forEach(b=>b.onclick=async ()=>{ await syncDelete('monthGoals', b.dataset.delmonth); render(); });
  }

  /* ============ 年 ============ */
  function viewYear(){
    const y = todayStr().slice(0,4);
    const items = S.yearGoals.filter(x=>x.year===y);
    let h = `<div class="section-title">${y} 年的愿景</div>`;
    if(items.length) items.forEach(x=>h+=`<div class="card row"><div class="grow"><div>${esc(x.title)}</div>${x.desc?`<div class="muted" style="font-size:13px">${esc(x.desc)}</div>`:''}</div><button class="iconbtn" data-delyear="${x.id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>`);
    else h+=`<div class="empty">还没写今年的愿望。</div>`;
    h += `<div class="card">
      <div class="section-title" style="margin:0 0 8px">写下一个年度目标</div>
      <input id="yTitle" type="text" placeholder="例如：一起去趟海边" style="margin-bottom:8px"/>
      <input id="yDesc" type="text" placeholder="为什么想要它（可选）"/>
      <button class="block" style="margin-top:10px" id="addYear">添加</button>
    </div>`;
    return h;
  }
  function bindYear(){
    const a=document.getElementById('addYear'); if(!a) return;
    a.onclick=()=>{ const t=document.getElementById('yTitle').value.trim(); if(!t) return; const row={id:uid(),title:t,desc:document.getElementById('yDesc').value.trim(),year:todayStr().slice(0,4)}; syncInsert('yearGoals', row).then(render); };
    document.querySelectorAll('[data-delyear]').forEach(b=>b.onclick=async ()=>{ await syncDelete('yearGoals', b.dataset.delyear); render(); });
  }

  /* ============ 习惯 ============ */
  function streak(dates){
    let s=0; let d=new Date(todayStr()+'T00:00:00');
    if(!dates.includes(todayStr())) d.setDate(d.getDate()-1);
    while(dates.includes(fmt(d))){ s++; d.setDate(d.getDate()-1); }
    return s;
  }
  function viewHabit(){
    let h = `<div class="section-title">我的小习惯</div>`;
    if(S.habits.length) S.habits.forEach(x=>{
      const on = x.doneDates.includes(todayStr());
      h += `<div class="card row">
        <div class="grow"><div>${esc(x.name)}</div><div class="muted" style="font-size:13px">连续 ${streak(x.doneDates)} 天</div></div>
        <button class="sm ${on?'soft':''}" data-habit="${x.id}">${on?'今天已打卡':'打卡'}</button>
        <button class="iconbtn" data-delhabit="${x.id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>
      </div>`;
    }); else h+=`<div class="empty">还没有习惯，养一个试试？</div>`;
    h += `<div class="card"><div class="row"><input id="hName" type="text" placeholder="习惯名称，如：喝水 8 杯"/><button class="sm" id="addHabit">加</button></div></div>`;
    return h;
  }
  function bindHabit(){
    const a=document.getElementById('addHabit'); if(!a) return;
    a.onclick=()=>{ const t=document.getElementById('hName').value.trim(); if(!t) return; const row={id:uid(),name:t,doneDates:[]}; syncInsert('habits', row).then(render); };
    document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=async ()=>{ const hb=S.habits.find(x=>x.id===b.dataset.habit); const t=todayStr(); const i=hb.doneDates.indexOf(t); if(i>=0) hb.doneDates.splice(i,1); else hb.doneDates.push(t); await syncUpdate('habits', hb); render(); });
    document.querySelectorAll('[data-delhabit]').forEach(b=>b.onclick=async ()=>{ await syncDelete('habits', b.dataset.delhabit); render(); });
  }

  /* ============ 更多 ============ */
  function daysUntil(dateStr){
    const t=new Date(todayStr()+'T00:00:00');
    let next=new Date(t.getFullYear(), parseInt(dateStr.slice(5,7))-1, parseInt(dateStr.slice(8,10)));
    if(next < t) next=new Date(t.getFullYear()+1, next.getMonth(), next.getDate());
    return Math.round((next - t)/86400000);
  }
  function viewMore(){
    // 特别日子（云端 or 本机）
    let sd = `<div class="section-title">特别日子</div>`;
    if(S.specialDates.length){
      S.specialDates.slice().sort((a,b)=>daysUntil(a.date)-daysUntil(b.date)).forEach(x=>{
        const d=daysUntil(x.date);
        sd += `<div class="card row"><div class="grow"><div>${esc(x.title)}</div><div class="muted" style="font-size:13px">${x.date} · ${d===0?'就是今天':'还有 '+d+' 天'}</div></div><button class="iconbtn" data-delsd="${x.id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>`;
      });
    } else sd+=`<div class="empty">还没有标记特别的日子。</div>`;
    sd += `<div class="card"><div class="row"><input id="sdDate" type="date" style="flex:1"/><input id="sdTitle" type="text" placeholder="日子名字" style="flex:2"/></div><button class="block" style="margin-top:8px" id="addSd">添加</button></div>`;

    // 今天的第一句话（本机）
    let warm = `<div class="section-title">今天的第一句话</div>
      <div class="card"><div class="muted" style="font-size:13px;margin-bottom:8px">写一句温柔的话，留给打开 app 的自己或对方。</div>
      <textarea id="warmText" placeholder="例如：今天也要好好吃饭。">${esc(S.warmMessage.text)}</textarea>
      <button class="block soft" style="margin-top:8px" id="saveWarm">保存这句话</button>
      ${S.warmMessage.updatedAt?`<div class="muted" style="font-size:12px;margin-top:6px">上次更新：${new Date(S.warmMessage.updatedAt).toLocaleString('zh-CN')}</div>`:''}</div>`;

    // 悄悄话（云端 or 本机）
    let wh;
    if(cloudReady){
      wh = `<div class="section-title">悄悄话 <span class="cloud-badge">● 两人同步</span></div>`;
      if(cloudWhispers.length) cloudWhispers.forEach(x=>wh+=`<div class="card row"><div class="grow">${esc(x.text)}</div><button class="iconbtn" data-delwh="${x.id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>`);
      else wh+=`<div class="empty">还没留过悄悄话。</div>`;
      wh += `<div class="card"><div class="row"><input id="whText" type="text" placeholder="写一句想对 ta 说的话…"/><button class="sm" id="addWh">留</button></div></div>`;
    } else {
      wh = `<div class="section-title">悄悄话</div>`;
      if(S.whispers.length) S.whispers.slice().reverse().forEach(x=>wh+=`<div class="card row"><div class="grow">${esc(x.text)}</div><button class="iconbtn" data-delwh="${x.id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>`);
      else wh+=`<div class="empty">还没留过悄悄话。</div>`;
      wh += `<div class="card"><div class="row"><input id="whText" type="text" placeholder="写一句想说的话…"/><button class="sm" id="addWh">留</button></div></div>`;
      wh += `<div class="cloud-note">登录并配对后，悄悄话会两人实时同步。</div>`;
    }

    // 共享清单（云端 or 本机）
    let sl;
    if(cloudReady){
      const items = (cloudList && cloudList.items) || [];
      sl = `<div class="section-title">共享清单 <span class="cloud-badge">● 两人同步</span></div>`;
      if(items.length) items.forEach(x=>{
        sl += `<div class="card row"><div class="check ${x.done?'on':''}" data-togglesl="${x.id}" style="width:22px;height:22px">${x.done?'✓':''}</div><div class="grow" style="${x.done?'text-decoration:line-through;color:var(--ink-soft)':''}">${esc(x.text)}</div><button class="iconbtn" data-delsl="${x.id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>`;
      }); else sl+=`<div class="empty">清单是空的。</div>`;
      sl += `<div class="card"><div class="row"><input id="slText" type="text" placeholder="加一件两个人都关心的…"/><button class="sm" id="addSl">加</button></div></div>`;
    } else {
      sl = `<div class="section-title">共享清单</div>`;
      if(S.sharedList.length) S.sharedList.forEach(x=>{
        sl += `<div class="card row"><div class="check ${x.done?'on':''}" data-togglesl="${x.id}" style="width:22px;height:22px">${x.done?'✓':''}</div><div class="grow" style="${x.done?'text-decoration:line-through;color:var(--ink-soft)':''}">${esc(x.text)}</div><button class="iconbtn" data-delsl="${x.id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div>`;
      }); else sl+=`<div class="empty">清单是空的。</div>`;
      sl += `<div class="card"><div class="row"><input id="slText" type="text" placeholder="加一件两个人都关心的…"/><button class="sm" id="addSl">加</button></div></div>`;
      sl += `<div class="cloud-note">登录并配对后，清单会两人实时同步。</div>`;
    }

    return sd + warm + wh + sl;
  }
  function bindMore(){
    const as=document.getElementById('addSd'); if(as) as.onclick=()=>{ const d=document.getElementById('sdDate').value; const t=document.getElementById('sdTitle').value.trim(); if(!d||!t) return; const row={id:uid(),date:d,title:t}; syncInsert('specialDates', row).then(render); };
    document.querySelectorAll('[data-delsd]').forEach(b=>b.onclick=async ()=>{ await syncDelete('specialDates', b.dataset.delsd); render(); });

    const sw=document.getElementById('saveWarm'); if(sw) sw.onclick=()=>{ S.warmMessage={text:document.getElementById('warmText').value,updatedAt:Date.now()}; save(); toast('已保存 ✓'); };

    const aw=document.getElementById('addWh'); if(aw) aw.onclick=async ()=>{
      const val=document.getElementById('whText').value.trim(); if(!val) return;
      if(cloudReady){
        const { error } = await sb.from('whispers').insert({ from_user_id: me.id, to_user_id: partnerId, text: val });
        if(error) return toast(error.message);
        document.getElementById('whText').value=''; await refreshCloud();
      } else {
        S.whispers.push({id:uid(),text:val,createdAt:Date.now()}); save(); render();
      }
    };
    document.querySelectorAll('[data-delwh]').forEach(b=>b.onclick=async ()=>{
      const id=b.dataset.delwh;
      if(cloudReady){ const { error } = await sb.from('whispers').delete().eq('id', id); if(error) return toast(error.message); await refreshCloud(); }
      else { S.whispers=S.whispers.filter(x=>x.id!==id); save(); render(); }
    });

    const al=document.getElementById('addSl'); if(al) al.onclick=async ()=>{
      const val=document.getElementById('slText').value.trim(); if(!val) return;
      if(cloudReady){
        const items = (cloudList.items||[]).concat([{id:uid(),text:val,done:false}]);
        const { error } = await sb.from('shared_lists').update({ items }).eq('id', cloudList.id);
        if(error) return toast(error.message);
        cloudList.items=items; document.getElementById('slText').value=''; render();
      } else {
        S.sharedList.push({id:uid(),text:val,done:false}); save(); render();
      }
    };
    document.querySelectorAll('[data-togglesl]').forEach(b=>b.onclick=async ()=>{
      const id=b.dataset.togglesl;
      if(cloudReady){
        const items = cloudList.items.map(x=> x.id===id ? {...x, done:!x.done} : x);
        const { error } = await sb.from('shared_lists').update({ items }).eq('id', cloudList.id);
        if(error) return toast(error.message);
        cloudList.items=items; render();
      } else {
        const it=S.sharedList.find(x=>x.id===id); if(it) it.done=!it.done; save(); render();
      }
    });
    document.querySelectorAll('[data-delsl]').forEach(b=>b.onclick=async ()=>{
      const id=b.dataset.delsl;
      if(cloudReady){
        const items = cloudList.items.filter(x=>x.id!==id);
        const { error } = await sb.from('shared_lists').update({ items }).eq('id', cloudList.id);
        if(error) return toast(error.message);
        cloudList.items=items; render();
      } else {
        S.sharedList=S.sharedList.filter(x=>x.id!==id); save(); render();
      }
    });
  }

  /* ============ 启动 ============ */
  document.getElementById('accountBtn').onclick = openAccount;

  // 首屏默认停在登录页（避免先闪一下主界面）
  byId('tabLogin').onclick  = () => setAuthMode('login');
  byId('tabSignup').onclick = () => setAuthMode('signup');
  byId('auSubmit').onclick  = doAuth;
  byId('auGuest').onclick   = () => { guest = true; hideAuth(); toast('离线模式：数据只存在本机'); };
  byId('auAuto').onchange   = e => saveAuthPref({ autoLogin: e.target.checked });
  ['auEmail','auPass','auPass2','auName'].forEach(id =>
    byId(id).addEventListener('keydown', e => { if(e.key === 'Enter') doAuth(); }));

  const pref0 = authPref();
  byId('auAuto').checked = pref0.autoLogin !== false;
  byId('auEmail').value  = pref0.email || '';
  setAuthMode('login');

  render();
  initSB();
  // 断网时改动都压在本机队列里，恢复网络或切回前台时补传
  window.addEventListener('online', () => runSync());
  document.addEventListener('visibilitychange', () => { if(!document.hidden) runSync(); });
  if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW 失败',e)) ); }
  </script>
